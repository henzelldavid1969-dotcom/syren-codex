<title>The Syren Protocols</title>
<link rel="stylesheet" href="/fonts/fonts.css">
<style>
:root{--bg:#0e0f0f;--surface:#151616;--raise:#1d1f1f;--line:#2a2d2c;--fg:#ededed;--muted:#9ba09e;--accent:#B8DF0D;--accent-fg:#141a00;--accent-ink:#B8DF0D;--edge:transparent;--attrib-inv:invert(1);
--loc:#B8DF0D;--chr:#7aa7ff;--obj:#e3b562;--lor:#c58bd9;--gc:#B8DF0D;--ge:#e3b562;--gu:#e08a7a;--rus:#e5625a;--glow:rgba(184,223,13,.14);--mapbg:#0b0d0d;color-scheme:dark}
@media(prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#fcfcfb;--surface:#f6f6f4;--raise:#ffffff;--line:#e2e3e0;--fg:#161817;--muted:#626865;--accent:#B8DF0D;--accent-fg:#141a00;--accent-ink:#161817;--edge:#161817;--attrib-inv:none;--loc:#161817;--chr:#3b6fd6;--obj:#a9741a;--lor:#9345ab;--gc:#B8DF0D;--ge:#a9741a;--gu:#c0503f;--rus:#c9382f;--glow:rgba(184,223,13,.12);--mapbg:#f1f2ef;color-scheme:light}}
:root[data-theme="light"]{--bg:#fcfcfb;--surface:#f6f6f4;--raise:#ffffff;--line:#e2e3e0;--fg:#161817;--muted:#626865;--accent:#B8DF0D;--accent-fg:#141a00;--accent-ink:#161817;--edge:#161817;--attrib-inv:none;--loc:#161817;--chr:#3b6fd6;--obj:#a9741a;--lor:#9345ab;--gc:#B8DF0D;--ge:#a9741a;--gu:#c0503f;--rus:#c9382f;--glow:rgba(184,223,13,.12);--mapbg:#f1f2ef;color-scheme:light}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--fg);font:300 15.5px/1.65 Geist,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;cursor:pointer}
.mono{font-family:"JetBrains Mono",ui-monospace,monospace}
.wrap{max-width:1180px;margin:0 auto;padding:0 max(16px,env(safe-area-inset-left))}
.nav{position:sticky;top:0;z-index:40;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.nav .wrap{display:flex;align-items:center;gap:20px;height:56px}
.brand{display:flex;align-items:center;gap:9px;font-weight:400;letter-spacing:-.01em;white-space:nowrap}
.brand i{width:20px;height:20px;border-radius:5px;background:var(--accent);display:grid;place-items:center}
.brand i:before{content:"";width:8px;height:8px;border:2px solid var(--accent-fg);border-radius:50%}
.links{display:flex;gap:2px;flex:1;overflow-x:auto;scrollbar-width:none}
.links a{padding:6px 10px;border-radius:6px;color:var(--muted);font-size:14px;white-space:nowrap}
.links a:hover,.links a.on{color:var(--fg);background:var(--raise)}
.sbtn{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:6px 10px;color:var(--muted);font-size:13px;min-width:0}
.sbtn:hover{border-color:var(--muted)}
.sbtn kbd,.kbd{font:11px "JetBrains Mono",monospace;border:1px solid var(--line);border-radius:4px;padding:1px 5px;color:var(--muted)}
.btn{display:inline-flex;align-items:center;gap:8px;border-radius:8px;padding:9px 16px;font-weight:400;font-size:14px;border:1px solid var(--line);background:var(--raise)}
.btn:hover{border-color:var(--muted)}
.btn.p{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.btn.p:hover{filter:brightness(1.08)}
.story{font-size:13px;color:var(--muted);white-space:nowrap}
.story:hover{color:var(--fg)}
@media(max-width:760px){.sbtn span.t,.sbtn kbd,.story{display:none}.nav .wrap{gap:10px}}
.hero{position:relative;padding:96px 0 48px;text-align:center;background:radial-gradient(60% 70% at 50% 0%,var(--glow),transparent 70%)}.hero:before{content:'';position:absolute;inset:0;background-image:radial-gradient(var(--line) 1px,transparent 1px);background-size:22px 22px;-webkit-mask-image:radial-gradient(60% 80% at 50% 20%,#000,transparent 75%);mask-image:radial-gradient(60% 80% at 50% 20%,#000,transparent 75%);opacity:.7;pointer-events:none}.hero .wrap{position:relative}.ico{width:1em;height:1em;stroke:currentColor;fill:none;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round;flex:none}.card .ic .ico{width:19px;height:19px}.card .arr{position:absolute;top:22px;right:22px;color:var(--muted);transition:transform .15s,color .15s}a.card:hover .arr{color:var(--c);transform:translate(2px,-2px)}.sugg{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:14px}.sugg button{background:none;border:1px solid var(--line);border-radius:99px;padding:4px 12px;font-size:13px;color:var(--muted)}.sugg button:hover{color:var(--fg);border-color:var(--muted)}.sechead{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:6px}
.pill{display:inline-flex;gap:8px;align-items:center;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:4px 12px 4px 6px;font-size:13px;color:var(--muted)}
.pill b{background:var(--accent);color:var(--accent-fg);border-radius:99px;padding:0 8px;font-weight:500;font-size:12px}
h1{font-size:clamp(36px,6.2vw,66px);line-height:1.06;letter-spacing:-.04em;font-weight:300;margin:22px auto 0;max-width:15em}
h1 em{font-style:normal;color:var(--accent);display:block;font-weight:300}
.lede{color:var(--muted);font-size:clamp(16px,2vw,19px);max-width:36em;margin:20px auto 0}
.cta{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:28px}
.herosearch{max-width:560px;margin:26px auto 0}
.bigs{width:100%;display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:15px 18px;box-shadow:0 8px 30px -12px rgba(0,0,0,.25);font-weight:300;font-size:16px;color:var(--muted);text-align:left}
.bigs:hover{border-color:var(--muted)}
.bigs span{flex:1}
.sec{padding:36px 0}
.sec h2{font-size:clamp(26px,3.4vw,36px);letter-spacing:-.03em;font-weight:300;margin:0 0 6px}
.sec .sub{color:var(--muted);margin:0 0 22px;max-width:40em}
.eyebrow{font:500 12px "JetBrains Mono",monospace;text-transform:uppercase;letter-spacing:.08em;color:var(--accent-ink);margin-bottom:10px}
.bento{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.card{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:24px;overflow:hidden;display:flex;flex-direction:column;gap:10px;min-height:230px;transition:border-color .15s,transform .15s}
a.card:hover{border-color:var(--c,var(--accent));transform:translateY(-2px)}
.card:before{content:"";position:absolute;inset:0;background:radial-gradient(70% 60% at 0% 0%,color-mix(in srgb,var(--c) 14%,transparent),transparent 70%);pointer-events:none}
.card .ic{width:40px;height:40px;border-radius:10px;border:1px solid color-mix(in srgb,var(--c) 35%,var(--line));display:grid;place-items:center;color:var(--c);font:500 14px "JetBrains Mono",monospace;background:color-mix(in srgb,var(--c) 10%,transparent)}
.card h3{margin:8px 0 0;font-size:18px;letter-spacing:-.01em;font-weight:400}
.card p{margin:0;color:var(--muted);font-size:14px;flex:1}
.card .foot{display:flex;justify-content:space-between;align-items:center;font:12px "JetBrains Mono",monospace;color:var(--muted)}
.card .n{color:var(--c)}
.card.wide{grid-column:span 2}
@media(max-width:960px){.bento{grid-template-columns:repeat(2,1fr)}}
@media(max-width:520px){.bento{grid-template-columns:1fr}.card.wide{grid-column:auto}}
.mediarow{display:flex;gap:8px;flex-wrap:wrap}
.chip .ico{width:13px;height:13px}.chip{display:inline-flex;gap:6px;align-items:center;border:1px solid var(--line);border-radius:99px;padding:3px 10px;font-size:12px;color:var(--muted);background:var(--raise)}
.mapwrap{display:grid;grid-template-columns:300px 1fr;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--mapbg);height:var(--mh,560px)}
.mapwrap.compact{grid-template-columns:1fr}
.mapwrap.compact .mpanel{display:none}
.mpanel{border-right:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;min-height:0}
.mpanel .ms{padding:10px;border-bottom:1px solid var(--line)}
.mpanel input{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:8px 10px;color:var(--fg);font:inherit;font-size:14px}
.mpanel input:focus,.palette input:focus,.fin:focus{outline:2px solid var(--accent-ink);outline-offset:-1px}
.mlist{overflow:auto;flex:1;padding:6px}
.mlist h4{font:500 11px "JetBrains Mono",monospace;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:12px 8px 4px}
.mi{display:flex;gap:10px;align-items:center;width:100%;text-align:left;background:none;border:0;border-radius:6px;padding:7px 8px;font-size:14px}
.mi:hover,.mi.on{background:var(--raise)}
.dot{width:10px;height:10px;border-radius:50%;flex:none;background:var(--dc)}
.mi small{margin-left:auto;font:11px "JetBrains Mono",monospace;color:var(--muted)}
.mcanvas{position:relative;min-height:0;overflow:hidden;touch-action:none;cursor:grab}
.mcanvas:active{cursor:grabbing}
.mcanvas svg{width:100%;height:100%;display:block}
.mcanvas svg .gr{stroke:var(--line);stroke-width:.4;vector-effect:non-scaling-stroke;opacity:.7}
.mcanvas svg .perim{stroke-width:1.2;vector-effect:non-scaling-stroke;stroke-linejoin:round}
.mcanvas svg .perim.op{fill:var(--fg);fill-opacity:.045;stroke:var(--muted)}
.mcanvas svg .perim.rp{fill:var(--fg);fill-opacity:.02;stroke:var(--muted);stroke-dasharray:2 3;opacity:.8}
.mcanvas svg .rt{fill:none;stroke:var(--accent);stroke-width:2;vector-effect:non-scaling-stroke;stroke-dasharray:6 4;stroke-linecap:round}
.mcanvas svg circle.halo{r:calc(14px*var(--k));fill:none;stroke:var(--fg);stroke-width:calc(1.4px*var(--k));opacity:.8}
.mcanvas svg circle.hit{r:calc(14px*var(--k));fill:transparent;cursor:pointer}
.mcanvas svg text{font:500 calc(11.5px*var(--k)) Geist,sans-serif;fill:var(--fg);paint-order:stroke;stroke:var(--mapbg);stroke-width:calc(3px*var(--k));pointer-events:none}
/* the River Vistula on every map: a neutral band, under everything else */
:root{--river:color-mix(in srgb,var(--fg) 13%,var(--mapbg))}
.mcanvas svg .riv{fill:none;stroke:var(--river);stroke-width:max(calc(4px * var(--k)),3.6px);stroke-linecap:round;stroke-linejoin:round}
.mcanvas svg text.rivl{font:500 calc(9.5px*var(--k)) "JetBrains Mono",monospace;letter-spacing:.4em;fill:var(--muted);stroke:none;paint-order:normal}
/* street map */
.mapwrap.street .mcanvas{cursor:default;touch-action:auto}
.mgl,.mgl.maplibregl-map{position:absolute;inset:0;width:100%;height:100%}
.mgl .maplibregl-canvas{outline:none}
.mapwrap.street .mnote{left:10px;right:auto;text-align:left;bottom:10px}
.mk{position:relative;display:grid;place-items:center;width:22px;height:22px;padding:0;border:0;background:none;cursor:pointer;color:var(--fg)}
.mk .gly{width:16px;height:16px}
.mk.k-node .gly,.mk.k-gate .gly,.mk.k-kos .gly{width:13px;height:13px}
.mk span{position:absolute;left:21px;top:50%;transform:translateY(-50%);display:none;white-space:nowrap;font:500 12px Geist,system-ui,sans-serif;color:var(--fg);text-shadow:0 0 3px var(--mapbg),0 0 3px var(--mapbg),0 0 2px var(--mapbg);pointer-events:none}
.mk.lab span{display:block}
.mk.sel:before{content:"";position:absolute;inset:-6px;border-radius:50%;border:1.5px solid var(--fg);opacity:.8}
.mk:focus-visible{outline:2px solid var(--fg);outline-offset:3px;border-radius:50%}
.mapwrap.street .maplibregl-ctrl-attrib{font:11px Geist,system-ui,sans-serif;background:color-mix(in srgb,var(--surface) 85%,transparent);color:var(--muted)}
.mapwrap.street .maplibregl-ctrl-attrib a{color:var(--muted)}
.mapwrap.street .maplibregl-ctrl-attrib-button{filter:var(--attrib-inv)}
.tiles .riv{fill:none;stroke:color-mix(in srgb,var(--fg) 13%,transparent);stroke-width:6;stroke-linecap:round;stroke-linejoin:round}
.tiles .scan .sriv{fill:none;stroke:color-mix(in srgb,var(--fg) 13%,transparent);stroke-width:8;stroke-linecap:round;stroke-linejoin:round}
.mtools{position:absolute;top:10px;left:10px;display:flex;gap:6px;flex-wrap:wrap;max-width:calc(100% - 70px)}
.mtools .chip{cursor:pointer;background:color-mix(in srgb,var(--surface) 90%,transparent);backdrop-filter:blur(6px)}
.mtools .chip.off{opacity:.45;text-decoration:line-through}
.mzoom{position:absolute;top:10px;right:10px;display:flex;flex-direction:column;gap:4px}
.mzoom button{width:32px;height:32px;border-radius:7px;border:1px solid var(--line);background:var(--surface);font-size:17px;line-height:1}
.mzoom button:hover{border-color:var(--muted)}
.mcard{position:absolute;left:10px;right:10px;bottom:10px;max-width:420px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:none;box-shadow:0 12px 40px rgba(0,0,0,.35)}
.mcard.on{display:block}
.mcard h4{font-weight:400;margin:0 0 2px;font-size:16px;letter-spacing:-.01em}
.mcard p{margin:0 0 10px;color:var(--muted);font-size:13.5px}
.mcard .x{position:absolute;top:8px;right:10px;background:none;border:0;color:var(--muted);font-size:18px}
.mnote{position:absolute;right:10px;bottom:8px;font-size:11px;color:var(--muted);max-width:50%;text-align:right;pointer-events:none}
@media(max-width:760px){.mapwrap{grid-template-columns:1fr;grid-template-rows:auto 1fr;height:auto}.mapwrap .mcanvas{height:62vh;order:-1}.mpanel{border-right:0;border-top:1px solid var(--line);max-height:300px}.mnote{display:none}}
.docs{display:grid;grid-template-columns:260px minmax(0,1fr) 250px;gap:36px;padding:28px 0 70px}
.docs.two{grid-template-columns:260px minmax(0,1fr)}
.side{position:sticky;top:76px;align-self:start;max-height:calc(100vh - 96px);overflow:auto;padding-right:6px}
.side h5{font:500 11px "JetBrains Mono",monospace;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:16px 8px 6px}
.side a{display:flex;gap:8px;align-items:center;padding:5px 8px;border-radius:6px;color:var(--muted);font-size:14px}
.side a:hover,.side a.on{color:var(--fg);background:var(--raise)}
.rail{position:sticky;top:76px;align-self:start;font-size:13.5px}
.rail .box{border:1px solid var(--line);border-radius:10px;padding:14px;background:var(--surface);margin-bottom:12px}
.rail h6{margin:0 0 8px;font:500 11px "JetBrains Mono",monospace;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.rail p{margin:0;color:var(--muted)}
.rail a.x{display:block;padding:3px 0;color:var(--fg)}
.rail a.x:hover{color:var(--accent-ink)}
@media(max-width:1020px){.docs,.docs.two{grid-template-columns:minmax(0,1fr)}.side,.rail{position:static;max-height:none}.side{display:none}}
.crumb{font:12px "JetBrains Mono",monospace;color:var(--muted);margin-bottom:10px}
.crumb a:hover{color:var(--fg)}
.ph{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:6px}
.tag{font:500 11px "JetBrains Mono",monospace;letter-spacing:.04em;border-radius:5px;padding:2px 7px;border:1px solid color-mix(in srgb,var(--c) 40%,var(--line));color:var(--c);background:color-mix(in srgb,var(--c) 9%,transparent)}
.main h1.t{font-weight:300;font-size:clamp(30px,4.4vw,44px);margin:6px 0 10px;text-align:left;max-width:none;letter-spacing:-.03em}
.main .sum{font-size:18px;color:var(--muted);margin:0 0 22px;line-height:1.5}
.prose{font:350 16.5px/1.75 Geist,system-ui,sans-serif;max-width:40em}
.prose p{margin:0 0 1em}
.media{display:grid;gap:12px;margin:0 0 24px}
.media img,.media video{width:100%;border-radius:10px;border:1px solid var(--line)}
.media audio{width:100%}
.media figcaption{font-size:13px;color:var(--muted);margin-top:6px}
.prose h2{font:400 22px/1.3 Geist,system-ui,sans-serif;letter-spacing:-.01em;margin:1.6em 0 .6em}
.prose blockquote{margin:1.2em 0;padding:0 0 0 18px;border-left:2px solid var(--line);color:var(--muted)}
.prose blockquote p{margin:0 0 .6em}
.prose table{display:block;overflow-x:auto;border-collapse:collapse;font:400 14px/1.5 Geist,system-ui,sans-serif;margin:0 0 1.2em}
.prose th,.prose td{border:1px solid var(--line);padding:7px 10px;text-align:left;vertical-align:top}
.prose th{background:var(--surface);font-weight:500}
.prose ul,.prose ol{padding-left:1.2em;margin:0 0 1em}
.prose .spk{font:400 12.5px "JetBrains Mono",monospace;letter-spacing:.04em;color:var(--muted);margin:0 0 1.4em}
.prose .spk strong{color:var(--accent-ink);font-weight:500}
/* Story pages: clear space between the heading (title and opening speaker line) and the first line of text */
.sprose>.spk:first-child{margin-bottom:3.4em}
.sprose>:first-child:not(.spk){margin-top:2.6em}
.prose .brk{text-align:center;color:var(--muted);letter-spacing:.4em;margin:1.8em 0}
.pager{display:flex;gap:12px;margin-top:40px;padding-top:22px;border-top:1px solid var(--line);max-width:40em}
.pager a{display:flex;flex-direction:column;gap:3px;border:1px solid var(--line);border-radius:10px;padding:12px 16px;background:var(--surface);min-width:0;flex:1}
.pager a:hover{border-color:var(--accent)}
.pager a.nx{text-align:right}
.pager small{font:11px "JetBrains Mono",monospace;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.toc{max-width:40em;margin-top:30px}
.toc h5{font:500 11px "JetBrains Mono",monospace;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:22px 0 8px}
.tagline{font-weight:400}.tagline strong{font-weight:500}
.g{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:5px;font:600 11px "JetBrains Mono",monospace;color:#07120c;background:var(--gc)}
.g{box-sizing:border-box}.g.E{background:color-mix(in srgb,var(--accent) 18%,transparent);border:1.5px solid var(--accent);color:var(--fg)}.g.U{background:none;border:1px dashed var(--muted);color:var(--fg)}
.gl{display:flex;gap:6px;align-items:center}
.ctl{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:0 0 16px}
.fin{flex:1;min-width:200px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 12px;color:var(--fg);font:inherit;font-size:14px}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{background:var(--surface);border:0;padding:8px 12px;font-size:13px;color:var(--muted);border-right:1px solid var(--line)}
.seg button:last-child{border:0}
.seg button.on{background:var(--raise);color:var(--fg)}
.row{display:block;border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:8px;background:var(--surface)}
.row:hover{border-color:var(--accent)}
.row .rt2{display:flex;gap:10px;align-items:center;justify-content:space-between}
.row b{font-weight:400;font-size:16px;letter-spacing:-.01em}
.row p{margin:4px 0 0;color:var(--muted);font-size:14px}
mark{background:color-mix(in srgb,var(--accent) 28%,transparent);color:inherit;border-radius:2px}
.empty{color:var(--muted);padding:30px 0;text-align:center}
.ov{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.55);backdrop-filter:blur(3px);display:none;align-items:flex-start;justify-content:center;padding:10vh 16px 0}
.ov.on{display:flex}
.palette{width:100%;max-width:640px;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:0 30px 80px rgba(0,0,0,.5);overflow:hidden}
.palette input{width:100%;background:none;border:0;border-bottom:1px solid var(--line);padding:16px 18px;font:inherit;font-size:17px;color:var(--fg);outline:none}
.pf{display:flex;gap:6px;padding:8px 12px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.pf .chip{cursor:pointer}.pf .chip.on{border-color:var(--accent);color:var(--fg)}
.pr{max-height:52vh;overflow:auto;padding:6px}
.pi{display:flex;gap:12px;align-items:flex-start;padding:9px 10px;border-radius:8px}
.pi.sel{background:var(--raise)}
.pi .tic{margin-top:4px;color:var(--muted)}
.pi b{font-weight:400}
.pi p{margin:1px 0 0;color:var(--muted);font-size:13px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pi small{margin-left:auto;font:11px "JetBrains Mono",monospace;color:var(--muted);white-space:nowrap;padding-top:3px}

  if(d._n.startsWith(t))m=16;else if(d._n.includes(' '+t))m=13;else if(d._n.includes(t))m=10;

/* map */
const LON0=20.89,LAT0=52.455,KX=Math.cos(52.23*Math.PI/180)*1000,KY=1000;
const prj=(x,y)=>[(x-LON0)*KX,(LAT0-y)*KY];
const KIND={out:['Survivor outposts'],node:['Route nodes'],gate:['Gates'],rus:['Occupier positions'],kos:['Other markers']};
// map symbols: shape, not colour, tells the kinds apart. sym() draws one on the
// map at scale k (map units per screen pixel); GLY holds the same shapes for lists.
function sym(kind,x,y,k){const X=x.toFixed(1),Y=y.toFixed(1),u=v=>(v*k).toFixed(2);
  if(kind==='out')return `<circle class="sy-ring" cx="${X}" cy="${Y}" r="${u(7)}" stroke-width="${u(1.3)}"/><circle class="sy-acid" cx="${X}" cy="${Y}" r="${u(3.4)}" stroke-width="${u(1)}"/>`;
  if(kind==='node')return `<circle class="sy-node" cx="${X}" cy="${Y}" r="${u(2.8)}"/>`;
  if(kind==='gate')return `<rect class="sy-gate" x="${(x-4.5*k).toFixed(1)}" y="${(y-4.5*k).toFixed(1)}" width="${u(9)}" height="${u(9)}" stroke-width="${u(1.4)}"/>`;
  if(kind==='rus'){const h=4.5*k;return `<path class="sy-x" d="M${(x-h).toFixed(1)} ${(y-h).toFixed(1)}L${(x+h).toFixed(1)} ${(y+h).toFixed(1)}M${(x+h).toFixed(1)} ${(y-h).toFixed(1)}L${(x-h).toFixed(1)} ${(y+h).toFixed(1)}" stroke-width="${u(1.8)}"/>`}
  const h=5*k;return `<path class="sy-kos" d="M${X} ${(y-h).toFixed(1)}L${(x+h).toFixed(1)} ${Y}L${X} ${(y+h).toFixed(1)}L${(x-h).toFixed(1)} ${Y}Z" stroke-width="${u(1)}"/>`}
const GLY={out:'<circle class="sy-ring" cx="7" cy="7" r="5.6" stroke-width="1.1"/><circle class="sy-acid" cx="7" cy="7" r="2.6" stroke-width=".8"/>',
  rus:'<path class="sy-x" d="M3.2 3.2l7.6 7.6m0-7.6l-7.6 7.6" stroke-width="1.6"/>',node:'<circle class="sy-node" cx="7" cy="7" r="2.4"/>',
  gate:'<rect class="sy-gate" x="3" y="3" width="8" height="8" stroke-width="1.3"/>',kos:'<path class="sy-kos" d="M7 2l5 5-5 5-5-5z" stroke-width="1"/>',
  rt:'<path class="sy-rt" d="M.5 7h13"/>',per:'<path class="sy-per" d="M2 4.5 6 2l6 2.5-1 6.5-6.5 1L2 9z"/>'};
const gly=k=>`<svg class="gly" viewBox="0 0 14 14" aria-hidden="true">${GLY[k]}</svg>`;
const FULL={x:0,y:0,w:(21.57-LON0)*KX,h:(LAT0-52.05)*KY};
// The drawn (SVG) map: used wherever the street map cannot run.
function mountSvgMap(root,opt){
  const compact=!!opt.compact;let vb={...FULL};let sel=null;const rid='riv'+Math.random().toString(36).slice(2,8);
  const on={out:1,node:1,gate:1,rus:1,kos:1,rt:1,per:1};
  root.innerHTML=`<div class="mapwrap ${compact?'compact':''}" style="--mh:${opt.h||560}px"><aside class="mpanel"><div class="ms"><input placeholder="Find a place on the map" aria-label="Find a place"></div><div class="mlist"></div></aside><div class="mcanvas"><svg></svg><div class="mtools"></div><div class="mzoom"><button data-z="1.5" aria-label="Zoom in">+</button><button data-z="0.67" aria-label="Zoom out">−</button><button data-z="0" aria-label="Reset view">⌖</button></div><div class="mcard"></div><div class="mnote">Schematic. Occupier positions are approximate.</div></div></div>`;
  const svg=$('svg',root),cv=$('.mcanvas',root),list=$('.mlist',root),card=$('.mcard',root);
  const path=c=>c.map((p,i)=>(i?'L':'M')+prj(p[0],p[1]).map(v=>v.toFixed(1)).join(' ')).join('');

    let g='';for(let lo=20.9;lo<21.6;lo+=.1){const x=((lo-LON0)*KX).toFixed(1);g+=`<line class="gr" x1="${x}" x2="${x}" y1="0" y2="${FULL.h}"/>`}
    for(let la=52.1;la<52.46;la+=.05){const y=((LAT0-la)*KY).toFixed(1);g+=`<line class="gr" y1="${y}" y2="${y}" x1="0" x2="${FULL.w}"/>`}
    let L='';MAP.lines.forEach(l=>{const d=path(l.c);
      // the Vistula: a band under everything else, named twice along its course
      if(l.k==='riv'){L+=`<path id="${rid}" class="riv" d="${d}"/>`+['15%','74%'].map(o=>`<text class="rivl" dy="0.35em"><textPath href="#${rid}" startOffset="${o}">${esc(l.n.toUpperCase())}</textPath></text>`).join('');return}
      if(l.k==='rus'&&on.per)L+=`<path class="perim rp" d="${d}Z"/>`;
      if(l.k==='occ'&&on.per)L+=`<path class="perim op" d="${d}Z"/>`;
      if(l.k==='esc'&&on.rt)L+=`<path class="rt" d="${d}"><title>${esc(l.n)}</title></path>`});
    const k=vb.w/(svg.clientWidth||800);let P='',T='';MAP.pts.forEach((p,i)=>{if(!on[p.k])return;const [x,y]=prj(p.x,p.y);
      if(sel===i)P+=`<circle class="halo" cx="${x.toFixed(1)}" cy="${y.toFixed(1)}"/>`;
      P+=sym(p.k,x,y,k)+`<circle class="hit" data-i="${i}" cx="${x.toFixed(1)}" cy="${y.toFixed(1)}"><title>${esc(p.n)}</title></circle>`;
      if(p.k==='out'||p.k==='rus'||sel===i)T+=`<text x="${(x+9*vb.w/(svg.clientWidth||800)).toFixed(1)}" y="${(y+3.5*vb.w/(svg.clientWidth||800)).toFixed(1)}">${esc(p.n.split(',')[0])}</text>`});

  function view(){svg.setAttribute('viewBox',`${vb.x} ${vb.y} ${vb.w} ${vb.h}`);svg.style.setProperty('--k',(vb.w/(svg.clientWidth||800)).toFixed(4))}
  function fit(){const r=svg.getBoundingClientRect();if(!r.width)return;const a=r.width/r.height;vb={...FULL};if(FULL.w/FULL.h<a){vb.w=FULL.h*a;vb.x=-(vb.w-FULL.w)/2}else{vb.h=FULL.w/a;vb.y=-(vb.h-FULL.h)/2}draw()}
  function zoom(f,cx,cy){const r=svg.getBoundingClientRect();const px=cx==null?.5:(cx-r.left)/r.width,py=cy==null?.5:(cy-r.top)/r.height;
    const nw=Math.min(Math.max(vb.w/f,30),FULL.w*1.3),k=nw/vb.w;const nh=vb.h*k;vb.x+=(vb.w-nw)*px;vb.y+=(vb.h-nh)*py;vb.w=nw;vb.h=nh;draw()}

    if(fly){const [x,y]=prj(p.x,p.y);const r=svg.getBoundingClientRect();vb.w=Math.min(vb.w,110);vb.h=vb.w*r.height/r.width;vb.x=x-vb.w/2;vb.y=y-vb.h/2}
    const e=BYID[p.e];card.innerHTML=`<button class="x" aria-label="Close">×</button><div class="eyebrow" style="margin:0 0 6px">${KIND[p.k][0]}</div><h4>${esc(p.n)}</h4><p>${esc(p.t)}</p>${e?`<a class="btn p" href="#e-${e.id}">Open entry ${e.ref.replace('SYNPTCL/','')}</a>`:'<span class="chip">No entry yet</span>'}`;
    card.classList.add('on');draw();paintList()}
  function paintList(){const q=$('input',root).value;let h='';
    Object.keys(KIND).forEach(k=>{const items=MAP.pts.map((p,i)=>[p,i]).filter(([p])=>p.k===k&&(!q||norm(p.n+' '+p.c+' '+p.t).includes(norm(q))));
      if(items.length)h+=`<h4>${KIND[k][0]}</h4>`+items.map(([p,i])=>`<button class="mi ${sel===i?'on':''}" data-i="${i}">${gly(k)}<span>${hl(p.n,q)}</span><small>${esc(p.c)}</small></button>`).join('')});
    list.innerHTML=h||'<div class="empty">No match.</div>'}
  const tools=$('.mtools',root);
  function paintTools(){tools.innerHTML=[['out','Outposts'],['rus','Occupier'],['node','Nodes'],['gate','Gates'],['rt','Routes'],['per','Perimeters']].map(([k,l])=>`<span class="chip ${on[k]?'':'off'}" data-k="${k}">${gly(k)}${l}</span>`).join('')}
  tools.onclick=e=>{const c=e.target.closest('.chip');if(!c)return;on[c.dataset.k]=!on[c.dataset.k];paintTools();draw()};
  $('.mzoom',root).onclick=e=>{const b=e.target.closest('button');if(!b)return;const z=+b.dataset.z;z?zoom(z):fit()};
  card.onclick=e=>{if(e.target.closest('.x')){sel=null;card.classList.remove('on');draw();paintList()}};
  list.onclick=e=>{const b=e.target.closest('.mi');if(b)pick(+b.dataset.i,true)};
  $('input',root).oninput=paintList;
  let drag=null,moved=false;const ptrs=new Map();let pd=0;
  svg.addEventListener('click',e=>{const h=e.target.closest('.hit');if(h&&!moved)pick(+h.dataset.i,false)});
  cv.addEventListener('wheel',e=>{if(compact&&!e.ctrlKey&&!e.metaKey)return;e.preventDefault();zoom(e.deltaY<0?1.2:1/1.2,e.clientX,e.clientY)},{passive:false});

}

// ---------------------------------------------------------------------------
// The street map: OpenStreetMap streets (via OpenFreeMap) restyled in the
// site's monochrome palette, with the corridor drawn on top. The software is
// served from /vendor and loaded only when a map is shown. Any failure (no
// WebGL, map server unreachable) falls back to the drawn map above.
// ---------------------------------------------------------------------------

      ${panel('Appears in',d.apps.length,(d.apps.length?d.apps.map(a=>{const p=(a.l||a.t).split(' · ');return `<a class="rl" href="#story-${a.s}" title="${esc(a.t)}"><span class="rp">${esc(p.length>1?p[0]:'')}</span><span class="tt">${esc(p.length>1?p.slice(1).join(' · '):p[0])}</span></a>`}).join(''):'')+(d.appears?`<details class="note"><summary>Note</summary><p>${esc(d.appears)}</p></details>`:'')+(!d.apps.length&&!d.appears?'<p>Not recorded</p>':''),true)}
      ${panel('Connected entries',rel.length,rel.length?groups.map(g=>`${groups.length>1||g!=='Connected'?`<div class="grp">${esc(g)}</div>`:''}${rel.filter(r=>r.label===g).map(r=>`<a class="rl" href="#e-${r.id}" title="${esc(BYID[r.id].name)}"><span class="rp">${BYID[r.id].ref.replace('SYNPTCL/','')}</span><span class="tt">${esc(BYID[r.id].name)}</span></a>`).join('')}`).join(''):`<p>${esc(d.xnote||'None recorded.')}</p>`,false)}
      ${panel('Record',2+(d.aliases?1:0)+(d.note?1:0),`<dl><dt>Status</dt><dd>${esc(d.status)}</dd><dt>Updated</dt><dd>${longDate(d.updated)||'Not recorded'}</dd>${d.aliases?`<dt>Also</dt><dd>${esc(d.aliases)}</dd>`:''}</dl>${d.note?`<p style="margin-top:10px">${esc(d.note)}</p>`:''}`,false)}
    </aside></div></div>`;
  $('#app').querySelectorAll('[data-lb]').forEach(a=>a.onclick=e=>{e.preventDefault();lbOpen(shown(d),+a.dataset.lb)})}
/* story */
let STORY=null,storyLoad=null;
const getStory=()=>storyLoad||(storyLoad=fetch('story.json').then(r=>{if(!r.ok)throw new Error(r.status);return r.json()}).then(s=>STORY=s).catch(e=>{storyLoad=null;throw e}));
function storyOrder(){const have=new Set(STORY.pages.map(p=>p.slug));const byS=Object.fromEntries(STORY.pages.map(p=>[p.slug,p]));
  const known=CHAPTERS.sections.filter(c=>have.has(c.s)).map(c=>({...c,html:byS[c.s].html}));
  const extra=STORY.pages.filter(p=>!CHAPTERS.sections.some(c=>c.s===p.slug)).map(p=>({s:p.slug,t:p.title,l:p.title,g:'after',html:p.html}));
  return known.concat(extra)}
function storySide(cur){const O=storyOrder(),c=O.find(x=>x.s===cur);return `<aside class="side">${CHAPTERS.groups.map(g=>{const items=O.filter(x=>x.g===g.c);return items.length?`<details data-acc="story" name="story"${c&&c.g===g.c?' open':''}><summary>${esc(g.n)}<span class="n">${items.length}</span></summary>${items.map(x=>`<a href="#story-${x.s}" class="${x.s===cur?'on':''}" title="${esc(x.t)}"><span>${esc(x.l||x.t)}</span></a>`).join('')}</details>`:''}).join('')}</aside>`}
function storyHome(){const S=STORY,O=storyOrder();const start=O.find(x=>x.s==='foreword')||O[0];
  $('#app').innerHTML=`<div class="wrap"><div class="docs two">${storySide('')}<div class="main"><div class="crumb"><a href="#home">Codex</a> / Story</div><div class="ph"><span class="tag" style="--c:var(--accent-ink)">MANUSCRIPT</span><span class="mono" style="font-size:12px;color:var(--muted)">First draft</span></div><h1 class="t">${esc(S.name)}</h1><p class="sum">${esc(S.subtitle)}</p>
    <div class="prose"><div class="tagline">${S.tagline}</div>${S.blurb}</div>
    <div class="cta" style="justify-content:flex-start"><a class="btn p" href="#story-${start.s}">${ico('book')} Start reading</a><a class="btn" href="#map">${ico('map')} Open the map</a></div>
    <div class="toc">${CHAPTERS.groups.map(g=>{const items=O.filter(x=>x.g===g.c);return items.length?`<h5>${esc(g.n)}</h5>`+items.map(x=>`<a class="row" href="#story-${x.s}"><b>${esc(x.t)}</b></a>`).join(''):''}).join('')}</div></div></div></div>`}
function storyPage(slug){const P=storyOrder(),i=P.findIndex(x=>x.s===slug);if(i<0){storyHome();return}const p=P[i],pv=P[i-1],nx=P[i+1];
  $('#app').innerHTML=`<div class="wrap"><div class="docs two">${storySide(slug)}<article class="main"><div class="crumb"><a href="#home">Codex</a> / <a href="#story">Story</a> / ${esc(p.t.split(':')[0])}</div><h1 class="t">${esc(p.t)}</h1>
    <div class="prose sprose">${p.html}</div>
    <nav class="pager">${pv?`<a href="#story-${pv.s}"><small>Previous</small>${esc(pv.t)}</a>`:'<a href="#story"><small>Back to</small>Contents</a>'}${nx?`<a class="nx" href="#story-${nx.s}"><small>Next</small>${esc(nx.t)}</a>`:'<a class="nx" href="#story"><small>Back to</small>Contents</a>'}</nav></article></div></div>`}
function storyRoute(h){const draw=()=>{h==='story'?storyHome():storyPage(h.slice(6));ctxPaint(h);scrollTo(0,0)};
  if(STORY)return draw();
  $('#app').innerHTML='<div class="wrap"><div class="empty">Opening the manuscript…</div></div>';
  getStory().then(()=>{if((location.hash||'#home').slice(1)===h)draw()}).catch(()=>{$('#app').innerHTML='<div class="wrap"><div class="empty">The manuscript could not be loaded. Please reload the page.</div></div>'})}
document.addEventListener('toggle',e=>{const d=e.target;if(d.tagName!=='DETAILS'||!d.open||!d.dataset.acc)return;document.querySelectorAll(`details[data-acc="${d.dataset.acc}"]`).forEach(x=>{if(x!==d)x.open=false})},true);
document.querySelectorAll('.brand .bt').forEach(x=>x.textContent=HOME.site.title);
const navEl=$('.nav'),menuBtn=$('#menu');
const menuSet=o=>{navEl.classList.toggle('open',o);menuBtn.setAttribute('aria-expanded',o?'true':'false')};
menuBtn.onclick=()=>menuSet(!navEl.classList.contains('open'));
document.addEventListener('click',e=>{if(navEl.classList.contains('open')&&!e.target.closest('.nav'))menuSet(false)});
document.addEventListener('keydown',e=>{if(e.key==='Escape')menuSet(false)});
/* lightbox */
const LB={list:[],i:0,last:null};const lbEl=$('#lb');
function lbShow(){const x=LB.list[LB.i],img=$('img',lbEl),n=LB.list.length;img.src=x.src;img.alt=x.alt||x.caption||'';
  $('figcaption',lbEl).textContent=[x.caption,x.credit&&'Credit: '+x.credit].filter(Boolean).join(' · ');
  $('.lbn',lbEl).textContent=n>1?`${LB.i+1} / ${n}`:'';$('.lp',lbEl).hidden=$('.ln',lbEl).hidden=n<2;
  if(n>1)[1,-1].forEach(k=>{new Image().src=LB.list[(LB.i+k+n)%n].src})}
function lbOpen(list,i){LB.list=list;LB.i=i;LB.last=document.activeElement;lbShow();lbEl.classList.add('on');document.body.style.overflow='hidden';$('.lx',lbEl).focus()}
function lbClose(){if(!lbEl.classList.contains('on'))return;lbEl.classList.remove('on');document.body.style.overflow='';$('img',lbEl).removeAttribute('src');LB.last&&LB.last.focus&&LB.last.focus()}
function lbGo(k){const n=LB.list.length;if(n<2)return;LB.i=(LB.i+k+n)%n;lbShow()}
$('.lx',lbEl).onclick=lbClose;$('.lp',lbEl).onclick=()=>lbGo(-1);$('.ln',lbEl).onclick=()=>lbGo(1);
lbEl.addEventListener('click',e=>{if(e.target===lbEl||e.target.tagName==='FIGURE')lbClose()});
document.addEventListener('keydown',e=>{if(!lbEl.classList.contains('on'))return;
  if(e.key==='Escape')lbClose();else if(e.key==='ArrowRight')lbGo(1);else if(e.key==='ArrowLeft')lbGo(-1);
  else if(e.key==='Tab'){const f=[...lbEl.querySelectorAll('button:not([hidden])')],i=f.indexOf(document.activeElement);f[(i+(e.shiftKey?-1:1)+f.length)%f.length].focus()}
  else{e.stopImmediatePropagation();return}e.preventDefault();e.stopImmediatePropagation()},true);
let lbX=null;$('img',lbEl).addEventListener('pointerdown',e=>{lbX=e.clientX});
$('img',lbEl).addEventListener('pointerup',e=>{if(lbX!==null&&Math.abs(e.clientX-lbX)>50)lbGo(e.clientX<lbX?1:-1);lbX=null});
function route(){const h=(location.hash||'#home').slice(1);navPaint(h);menuSet(false);lbClose();sheetClose(true);ctxPaint(h);
  if(h==='story'||h.startsWith('story-'))storyRoute(h);
  else if(h==='map')mapView();else if(h.startsWith('map-'))mapView(h.slice(4));
  else if(h.startsWith('c-')&&META[h.slice(2).toUpperCase()])cat(h.slice(2));
  else if(h.startsWith('e-'))entry(h.slice(2));else home();
  scrollTo(0,0)}
// ---------------------------------------------------------------------------
// "Where you are" bar (phones and tablets, where the sidebars are hidden):
// the current chapter or entry, previous and next, and a panel with the full
// contents. In chapters a thin line shows how far through you are.
// ---------------------------------------------------------------------------
const ctxEl=$('#ctx'),shEl=$('#sheet');let ctxBody=null,ctxTitle='',shLast=null;
const chevL='<svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5.5 8.5 12l6.5 6.5"/></svg>',chevR='<svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5.5 15.5 12 9 18.5"/></svg>';
function ctxPaint(h){let lab='',prev=null,next=null,prog=false;ctxBody=null;
  if(h==='story'&&STORY){const P=storyOrder();lab='The Story · Contents';prev='';next=P[0]?['#story-'+P[0].s,P[0].t]:'';ctxBody=()=>storySide('');ctxTitle='Contents'}
  else if(h.startsWith('story-')&&STORY){const P=storyOrder(),i=P.findIndex(x=>x.s===h.slice(6));if(i>-1){const p=P[i];lab=p.l||p.t;prev=P[i-1]?['#story-'+P[i-1].s,P[i-1].t]:['#story','Contents'];next=P[i+1]?['#story-'+P[i+1].s,P[i+1].t]:'';ctxBody=()=>storySide(p.s);ctxTitle='Contents';prog=true}}
  else if(h.startsWith('e-')&&BYID[h.slice(2)]){const d=BYID[h.slice(2)],L=markGroups(d.type).flatMap(g=>g.items),i=L.indexOf(d);lab=d.ref.replace('SYNPTCL/','')+' · '+d.name.replace(/ \(.*$/,'');
    prev=L[i-1]?['#e-'+L[i-1].id,L[i-1].name]:'';next=L[i+1]?['#e-'+L[i+1].id,L[i+1].name]:'';ctxBody=()=>side(d.type,d.id);ctxTitle='The Codex · '+META[d.type].label}
  else if(h.startsWith('c-')&&META[h.slice(2).toUpperCase()]){const t=h.slice(2).toUpperCase();lab=META[t].label+' · '+count(t)+' entries';ctxBody=()=>side(t,'');ctxTitle='The Codex'}
  if(!ctxBody){ctxEl.className='ctx';ctxEl.innerHTML='';return}
  const arr=(x,ic,rel)=>x===null?'':x?`<a class="cx-a" href="${x[0]}" aria-label="${rel}: ${esc(x[1])}">${ic}</a>`:`<span class="cx-a off" aria-hidden="true">${ic}</span>`;
  ctxEl.className='ctx on'+(prog?' prog':'');ctxEl.style.setProperty('--p',0);
  ctxEl.innerHTML=`${arr(prev,chevL,'Previous')}<button class="cx-t" type="button" aria-haspopup="dialog" aria-expanded="false" aria-label="${esc(lab)}. Open the contents"><span>${esc(lab)}</span><i class="chev" aria-hidden="true"></i></button>${arr(next,chevR,'Next')}${prog?'<div class="cx-p" aria-hidden="true"><i></i></div>':''}`;
  $('.cx-t',ctxEl).onclick=sheetOpen;ctxProg()}
function ctxProg(){if(!ctxEl.classList.contains('prog'))return;const a=$('.sprose');if(!a)return;const r=a.getBoundingClientRect(),vh=innerHeight;
  const p=Math.min(1,Math.max(0,(vh*.35-r.top)/Math.max(1,r.height-vh*.5)));ctxEl.style.setProperty('--p',p.toFixed(4))}
addEventListener('scroll',ctxProg,{passive:true});addEventListener('resize',ctxProg,{passive:true});
function sheetOpen(){if(!ctxBody)return;shLast=document.activeElement;$('#sh-t').textContent=ctxTitle;const b=$('.sh-b',shEl);b.innerHTML=ctxBody().replace(/ name="/g,' name="sh-');if(!$('details[open]',b)){const d=$('details',b);if(d)d.open=true}
  shEl.hidden=false;document.body.style.overflow='hidden';const t=$('.cx-t',ctxEl);t&&t.setAttribute('aria-expanded','true');
  requestAnimationFrame(()=>{shEl.classList.add('on');const c=$('a.on',b);if(c)c.scrollIntoView({block:'center'});$('.sh-x',shEl).focus()})}
function sheetClose(keepFocus){if(shEl.hidden)return;shEl.classList.remove('on');document.body.style.overflow='';const t=$('.cx-t',ctxEl);t&&t.setAttribute('aria-expanded','false');
  setTimeout(()=>{if(!shEl.classList.contains('on'))shEl.hidden=true},matchMedia('(prefers-reduced-motion:reduce)').matches?0:320);if(!keepFocus&&shLast&&shLast.isConnected)shLast.focus()}
$('.sh-x',shEl).onclick=()=>sheetClose();$('.sh-bd',shEl).onclick=()=>sheetClose();
shEl.addEventListener('click',e=>{if(e.target.closest('a[href^="#"]'))sheetClose(true)});
document.addEventListener('keydown',e=>{if(shEl.hidden)return;if(e.key==='Escape'){e.preventDefault();sheetClose()}
  else if(e.key==='Tab'){const f=[...shEl.querySelectorAll('button,a[href],summary')].filter(x=>x.offsetParent),i=f.indexOf(document.activeElement);if(f.length){e.preventDefault();f[(i+(e.shiftKey?-1:1)+f.length)%f.length].focus()}}});
addEventListener('hashchange',route);
$('#stamp').textContent=DATA.length+' entries, '+MAP.pts.length+' map points';
route();
</script>
