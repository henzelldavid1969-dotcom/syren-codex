<title>The Syren Protocols</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@200..700&family=Geist+Mono:wght@300;400;500&family=Newsreader:ital,wght@0,400;0,500;1,400&display=swap">
<style>
:root{--bg:#0e0f0f;--surface:#151616;--raise:#1d1f1f;--line:#2a2d2c;--fg:#ededed;--muted:#9ba09e;--accent:#A7C729;--accent-fg:#141a00;--accent-ink:#A7C729;--edge:transparent;--attrib-inv:invert(1);
--loc:#B8DF0D;--chr:#7aa7ff;--obj:#e3b562;--lor:#c58bd9;--gc:#A7C729;--ge:#e3b562;--gu:#e08a7a;--rus:#e5625a;--glow:rgba(167,199,41,.14);--mapbg:#0b0d0d;color-scheme:dark}
@media(prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#fcfcfb;--surface:#f6f6f4;--raise:#ffffff;--line:#e2e3e0;--fg:#161817;--muted:#626865;--accent:#B8DF0D;--accent-fg:#141a00;--accent-ink:#161817;--edge:#161817;--attrib-inv:none;--loc:#161817;--chr:#3b6fd6;--obj:#a9741a;--lor:#9345ab;--gc:#B8DF0D;--ge:#a9741a;--gu:#c0503f;--rus:#c9382f;--glow:rgba(184,223,13,.12);--mapbg:#f1f2ef;color-scheme:light}}
:root[data-theme="light"]{--bg:#fcfcfb;--surface:#f6f6f4;--raise:#ffffff;--line:#e2e3e0;--fg:#161817;--muted:#626865;--accent:#B8DF0D;--accent-fg:#141a00;--accent-ink:#161817;--edge:#161817;--attrib-inv:none;--loc:#161817;--chr:#3b6fd6;--obj:#a9741a;--lor:#9345ab;--gc:#B8DF0D;--ge:#a9741a;--gu:#c0503f;--rus:#c9382f;--glow:rgba(184,223,13,.12);--mapbg:#f1f2ef;color-scheme:light}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--fg);font:300 15.5px/1.65 Geist,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;cursor:pointer}
.mono{font-family:"Geist Mono",ui-monospace,monospace}
.wrap{max-width:1180px;margin:0 auto;padding:0 max(16px,env(safe-area-inset-left))}
.nav{position:sticky;top:0;z-index:40;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.nav .wrap{display:flex;align-items:center;gap:20px;height:56px}
.brand{display:flex;align-items:center;gap:9px;font-weight:400;letter-spacing:-.01em;white-space:nowrap}
.brand i{width:20px;height:20px;border-radius:5px;background:var(--accent);display:grid;place-items:center}
.brand i:before{content:"";width:8px;height:8px;border:2px solid var(--accent-fg);border-radius:50%}
.links{display:flex;gap:2px;flex:1;overflow-x:auto;scrollbar-width:none}
.links a{padding:6px 10px;border-radius:6px;color:var(--muted);font-size:14px;white-space:nowrap}
.links a:hover,.links a.on{color:var(--fg);background:var(--raise)}
.sbtn{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:6px 10px;color:var(--muted);font-size:13px;min-width:0}
.sbtn:hover{border-color:var(--muted)}
.sbtn kbd,.kbd{font:11px "Geist Mono",monospace;border:1px solid var(--line);border-radius:4px;padding:1px 5px;color:var(--muted)}
.btn{display:inline-flex;align-items:center;gap:8px;border-radius:8px;padding:9px 16px;font-weight:400;font-size:14px;border:1px solid var(--line);background:var(--raise)}
.btn:hover{border-color:var(--muted)}
.btn.p{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.btn.p:hover{filter:brightness(1.08)}
.story{font-size:13px;color:var(--muted);white-space:nowrap}
.story:hover{color:var(--fg)}
@media(max-width:760px){.sbtn span.t,.sbtn kbd,.story{display:none}.nav .wrap{gap:10px}}
.hero{position:relative;padding:96px 0 48px;text-align:center;background:radial-gradient(60% 70% at 50% 0%,var(--glow),transparent 70%)}.hero:before{content:'';position:absolute;inset:0;background-image:radial-gradient(var(--line) 1px,transparent 1px);background-size:22px 22px;-webkit-mask-image:radial-gradient(60% 80% at 50% 20%,#000,transparent 75%);mask-image:radial-gradient(60% 80% at 50% 20%,#000,transparent 75%);opacity:.7;pointer-events:none}.hero .wrap{position:relative}.ico{width:1em;height:1em;stroke:currentColor;fill:none;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round;flex:none}.card .ic .ico{width:19px;height:19px}.card .arr{position:absolute;top:22px;right:22px;color:var(--muted);transition:transform .15s,color .15s}a.card:hover .arr{color:var(--c);transform:translate(2px,-2px)}.sugg{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:14px}.sugg button{background:none;border:1px solid var(--line);border-radius:99px;padding:4px 12px;font-size:13px;color:var(--muted)}.sugg button:hover{color:var(--fg);border-color:var(--muted)}.sechead{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:6px}
.pill{display:inline-flex;gap:8px;align-items:center;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:4px 12px 4px 6px;font-size:13px;color:var(--muted)}
.pill b{background:var(--accent);color:var(--accent-fg);border-radius:99px;padding:0 8px;font-weight:500;font-size:12px}
h1{font-size:clamp(36px,6.2vw,66px);line-height:1.06;letter-spacing:-.04em;font-weight:300;margin:22px auto 0;max-width:15em}
h1 em{font-style:normal;color:var(--accent);display:block;font-weight:300}
.lede{color:var(--muted);font-size:clamp(16px,2vw,19px);max-width:36em;margin:20px auto 0}
.cta{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:28px}
.herosearch{max-width:560px;margin:26px auto 0}
.bigs{width:100%;display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:15px 18px;box-shadow:0 8px 30px -12px rgba(0,0,0,.25);font-weight:300;font-size:16px;color:var(--muted);text-align:left}
.bigs:hover{border-color:var(--muted)}
.bigs span{flex:1}
.sec{padding:36px 0}
.sec h2{font-size:clamp(26px,3.4vw,36px);letter-spacing:-.03em;font-weight:300;margin:0 0 6px}
.sec .sub{color:var(--muted);margin:0 0 22px;max-width:40em}
.eyebrow{font:500 12px "Geist Mono",monospace;text-transform:uppercase;letter-spacing:.08em;color:var(--accent-ink);margin-bottom:10px}
.bento{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.card{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:24px;overflow:hidden;display:flex;flex-direction:column;gap:10px;min-height:230px;transition:border-color .15s,transform .15s}
a.card:hover{border-color:var(--c,var(--accent));transform:translateY(-2px)}
.card:before{content:"";position:absolute;inset:0;background:radial-gradient(70% 60% at 0% 0%,color-mix(in srgb,var(--c) 14%,transparent),transparent 70%);pointer-events:none}
.card .ic{width:40px;height:40px;border-radius:10px;border:1px solid color-mix(in srgb,var(--c) 35%,var(--line));display:grid;place-items:center;color:var(--c);font:500 14px "Geist Mono",monospace;background:color-mix(in srgb,var(--c) 10%,transparent)}
.card h3{margin:8px 0 0;font-size:18px;letter-spacing:-.01em;font-weight:400}
.card p{margin:0;color:var(--muted);font-size:14px;flex:1}
.card .foot{display:flex;justify-content:space-between;align-items:center;font:12px "Geist Mono",monospace;color:var(--muted)}
.card .n{color:var(--c)}
.card.wide{grid-column:span 2}
@media(max-width:960px){.bento{grid-template-columns:repeat(2,1fr)}}
@media(max-width:520px){.bento{grid-template-columns:1fr}.card.wide{grid-column:auto}}
.mediarow{display:flex;gap:8px;flex-wrap:wrap}
.chip .ico{width:13px;height:13px}.chip{display:inline-flex;gap:6px;align-items:center;border:1px solid var(--line);border-radius:99px;padding:3px 10px;font-size:12px;color:var(--muted);background:var(--raise)}
.mapwrap{display:grid;grid-template-columns:300px 1fr;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--mapbg);height:var(--mh,560px)}
.mapwrap.compact{grid-template-columns:1fr}
.mapwrap.compact .mpanel{display:none}
.mpanel{border-right:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;min-height:0}
.mpanel .ms{padding:10px;border-bottom:1px solid var(--line)}
.mpanel input{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:8px 10px;color:var(--fg);font:inherit;font-size:14px}
.mpanel input:focus,.palette input:focus,.fin:focus{outline:2px solid var(--accent-ink);outline-offset:-1px}
.mlist{overflow:auto;flex:1;padding:6px}
.mlist h4{font:500 11px "Geist Mono",monospace;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:12px 8px 4px}
.mi{display:flex;gap:10px;align-items:center;width:100%;text-align:left;background:none;border:0;border-radius:6px;padding:7px 8px;font-size:14px}
.mi:hover,.mi.on{background:var(--raise)}
.dot{width:10px;height:10px;border-radius:50%;flex:none;background:var(--dc)}
.mi small{margin-left:auto;font:11px "Geist Mono",monospace;color:var(--muted)}
.mcanvas{position:relative;min-height:0;overflow:hidden;touch-action:none;cursor:grab}
.mcanvas:active{cursor:grabbing}
.mcanvas svg{width:100%;height:100%;display:block}
.mcanvas svg .gr{stroke:var(--line);stroke-width:.4;vector-effect:non-scaling-stroke;opacity:.7}
.mcanvas svg .perim{stroke-width:1.2;vector-effect:non-scaling-stroke;stroke-linejoin:round}
.mcanvas svg .perim.op{fill:var(--fg);fill-opacity:.045;stroke:var(--muted)}
.mcanvas svg .perim.rp{fill:var(--fg);fill-opacity:.02;stroke:var(--muted);stroke-dasharray:2 3;opacity:.8}
.mcanvas svg .rt{fill:none;stroke:var(--accent);stroke-width:2;vector-effect:non-scaling-stroke;stroke-dasharray:6 4;stroke-linecap:round}
.mcanvas svg circle.halo{r:calc(14px*var(--k));fill:none;stroke:var(--fg);stroke-width:calc(1.4px*var(--k));opacity:.8}
.mcanvas svg circle.hit{r:calc(14px*var(--k));fill:transparent;cursor:pointer}
.mcanvas svg text{font:500 calc(11.5px*var(--k)) Geist,sans-serif;fill:var(--fg);paint-order:stroke;stroke:var(--mapbg);stroke-width:calc(3px*var(--k));pointer-events:none}
/* the River Vistula on every map: a neutral band, under everything else */
:root{--river:color-mix(in srgb,var(--fg) 13%,var(--mapbg))}
.mcanvas svg .riv{fill:none;stroke:var(--river);stroke-width:max(calc(4px * var(--k)),3.6px);stroke-linecap:round;stroke-linejoin:round}
.mcanvas svg text.rivl{font:500 calc(9.5px*var(--k)) "Geist Mono",monospace;letter-spacing:.4em;fill:var(--muted);stroke:none;paint-order:normal}
/* street map */
.mapwrap.street .mcanvas{cursor:default;touch-action:auto}
.mgl,.mgl.maplibregl-map{position:absolute;inset:0;width:100%;height:100%}
.mgl .maplibregl-canvas{outline:none}
.mapwrap.street .mnote{left:10px;right:auto;text-align:left;bottom:10px}
.mk{position:relative;display:grid;place-items:center;width:22px;height:22px;padding:0;border:0;background:none;cursor:pointer;color:var(--fg)}
.mk .gly{width:16px;height:16px}
.mk.k-node .gly,.mk.k-gate .gly,.mk.k-kos .gly{width:13px;height:13px}
.mk span{position:absolute;left:21px;top:50%;transform:translateY(-50%);display:none;white-space:nowrap;font:500 12px Geist,system-ui,sans-serif;color:var(--fg);text-shadow:0 0 3px var(--mapbg),0 0 3px var(--mapbg),0 0 2px var(--mapbg);pointer-events:none}
.mk.lab span{display:block}
.mk.sel:before{content:"";position:absolute;inset:-6px;border-radius:50%;border:1.5px solid var(--fg);opacity:.8}
.mk:focus-visible{outline:2px solid var(--fg);outline-offset:3px;border-radius:50%}
.mapwrap.street .maplibregl-ctrl-attrib{font:11px Geist,system-ui,sans-serif;background:color-mix(in srgb,var(--surface) 85%,transparent);color:var(--muted)}
.mapwrap.street .maplibregl-ctrl-attrib a{color:var(--muted)}
.mapwrap.street .maplibregl-ctrl-attrib-button{filter:var(--attrib-inv)}
.tiles .riv{fill:none;stroke:color-mix(in srgb,var(--fg) 13%,transparent);stroke-width:6;stroke-linecap:round;stroke-linejoin:round}
.tiles .scan .sriv{fill:none;stroke:color-mix(in srgb,var(--fg) 13%,transparent);stroke-width:8;stroke-linecap:round;stroke-linejoin:round}
.mtools{position:absolute;top:10px;left:10px;display:flex;gap:6px;flex-wrap:wrap;max-width:calc(100% - 70px)}
.mtools .chip{cursor:pointer;background:color-mix(in srgb,var(--surface) 90%,transparent);backdrop-filter:blur(6px)}
.mtools .chip.off{opacity:.45;text-decoration:line-through}
.mzoom{position:absolute;top:10px;right:10px;display:flex;flex-direction:column;gap:4px}
.mzoom button{width:32px;height:32px;border-radius:7px;border:1px solid var(--line);background:var(--surface);font-size:17px;line-height:1}
.mzoom button:hover{border-color:var(--muted)}
/* Map page: hide the place list so the map fills the width */
.mzoom button.ml{margin-top:6px;display:grid;place-items:center}
.mzoom button.ml svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.5}
.mzoom button.ml.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.mapwrap.nolist{grid-template-columns:1fr}
.mapwrap.nolist .mpanel{display:none}
.mcard{position:absolute;left:10px;right:10px;bottom:10px;max-width:420px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:none;box-shadow:0 12px 40px rgba(0,0,0,.35)}
.mcard.on{display:block}
.mcard h4{font-weight:400;margin:0 0 2px;font-size:16px;letter-spacing:-.01em}
.mcard p{margin:0 0 10px;color:var(--muted);font-size:13.5px}
.mcard .x{position:absolute;top:8px;right:10px;background:none;border:0;color:var(--muted);font-size:18px}
.mnote{position:absolute;right:10px;bottom:8px;font-size:11px;color:var(--muted);max-width:50%;text-align:right;pointer-events:none}
@media(max-width:760px){.mapwrap{grid-template-columns:1fr;grid-template-rows:auto 1fr;height:auto}.mapwrap .mcanvas{height:62vh;order:-1}.mpanel{border-right:0;border-top:1px solid var(--line);max-height:300px}.mnote{display:none}}
.docs{display:grid;grid-template-columns:260px minmax(0,1fr) 250px;gap:36px;padding:28px 0 70px}
.docs.two{grid-template-columns:260px minmax(0,1fr)}
.side{position:sticky;top:76px;align-self:start;max-height:calc(100vh - 96px);overflow:auto;padding-right:6px}
.side h5{font:500 11px "Geist Mono",monospace;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:16px 8px 6px}
.side a{display:flex;gap:8px;align-items:center;padding:5px 8px;border-radius:6px;color:var(--muted);font-size:14px}
.side a:hover,.side a.on{color:var(--fg);background:var(--raise)}
.rail{position:sticky;top:76px;align-self:start;font-size:13.5px}
.rail .box{border:1px solid var(--line);border-radius:10px;padding:14px;background:var(--surface);margin-bottom:12px}
.rail h6{margin:0 0 8px;font:500 11px "Geist Mono",monospace;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.rail p{margin:0;color:var(--muted)}
.rail a.x{display:block;padding:3px 0;color:var(--fg)}
.rail a.x:hover{color:var(--accent-ink)}
@media(max-width:1020px){.docs,.docs.two{grid-template-columns:minmax(0,1fr)}.side,.rail{position:static;max-height:none}.side{display:none}}
.crumb{font:12px "Geist Mono",monospace;color:var(--muted);margin-bottom:10px}
.crumb a:hover{color:var(--fg)}
.ph{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:6px}
.tag{font:500 11px "Geist Mono",monospace;letter-spacing:.04em;border-radius:5px;padding:2px 7px;border:1px solid color-mix(in srgb,var(--c) 40%,var(--line));color:var(--c);background:color-mix(in srgb,var(--c) 9%,transparent)}
.main h1.t{font-weight:300;font-size:clamp(30px,4.4vw,44px);margin:6px 0 10px;text-align:left;max-width:none;letter-spacing:-.03em}
.main .sum{font-size:18px;color:var(--muted);margin:0 0 22px;line-height:1.5}
.prose{font:350 16.5px/1.75 Geist,system-ui,sans-serif;max-width:40em}
.prose p{margin:0 0 1em}
.media{display:grid;gap:12px;margin:0 0 24px}
.media img,.media video{width:100%;border-radius:10px;border:1px solid var(--line)}
.media audio{width:100%}
.media figcaption{font-size:13px;color:var(--muted);margin-top:6px}
.prose h2{font:400 22px/1.3 Geist,system-ui,sans-serif;letter-spacing:-.01em;margin:1.6em 0 .6em}
.prose blockquote{margin:1.2em 0;padding:0 0 0 18px;border-left:2px solid var(--line);color:var(--muted)}
.prose blockquote p{margin:0 0 .6em}
.prose table{display:block;overflow-x:auto;border-collapse:collapse;font:400 14px/1.5 Geist,system-ui,sans-serif;margin:0 0 1.2em}
.prose th,.prose td{border:1px solid var(--line);padding:7px 10px;text-align:left;vertical-align:top}
.prose th{background:var(--surface);font-weight:500}
.prose ul,.prose ol{padding-left:1.2em;margin:0 0 1em}
.prose .spk{font:400 12.5px "Geist Mono",monospace;letter-spacing:.04em;color:var(--muted);margin:0 0 1.4em}
.prose .spk strong{color:var(--accent-ink);font-weight:500}
/* Story pages: clear space between the heading (title and opening speaker line) and the first line of text */
.sprose>.spk:first-child{margin-bottom:3.4em}
.sprose>:first-child:not(.spk){margin-top:2.6em}
.prose .brk{text-align:center;color:var(--muted);letter-spacing:.4em;margin:1.8em 0}
.pager{display:flex;gap:12px;margin-top:40px;padding-top:22px;border-top:1px solid var(--line);max-width:40em}
.pager a{display:flex;flex-direction:column;gap:3px;border:1px solid var(--line);border-radius:10px;padding:12px 16px;background:var(--surface);min-width:0;flex:1}
.pager a:hover{border-color:var(--accent)}
.pager a.nx{text-align:right}
/* figures under Story tables (<!-- figure: TYPE --> in the text), drawn from the table above */
.fig{--fw:color-mix(in srgb,var(--accent) 15%,transparent);margin:-.4em 0 1.8em;border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:16px 16px 12px}
.fig .fsvg{display:block;width:100%;height:auto;overflow:visible}
.fig-map .fsvg,.fig-levels .fsvg,.fig-log .fsvg{overflow:hidden}
.fig text{font:10px "Geist Mono",monospace;fill:var(--muted);letter-spacing:.05em}
.fig figcaption{display:flex;justify-content:space-between;gap:4px 12px;flex-wrap:wrap;margin-top:12px;padding-top:10px;border-top:1px solid var(--line);font:500 10.5px "Geist Mono",monospace;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.fig figcaption span{font-weight:400;letter-spacing:.04em;text-transform:none;opacity:.8}
.fig .fw{fill:var(--fw);transition:transform 1.1s cubic-bezier(.3,.7,.3,1)}
.fig.on .fw path{animation:fg-sway 7s ease-in-out infinite alternate}
@keyframes fg-sway{from{transform:translateX(-40px)}to{transform:none}}
.fig .tk path,.fig .ax,.fig .tk1{stroke:var(--muted);stroke-width:1;opacity:.6;fill:none}
.fig .lvl path{stroke:var(--fg);stroke-width:1;stroke-dasharray:2 5;opacity:.5}
.fig .lvl{opacity:.3;transition:opacity .6s}.fig .lvl.on{opacity:1}.fig .lvl.on text{fill:var(--fg)}
.fig .run{stroke:var(--fg);stroke-width:2;fill:none;stroke-dasharray:1;stroke-dashoffset:1;opacity:.7}
.fig.run .run{transition:stroke-dashoffset 3.6s linear;stroke-dashoffset:0}
.fig .ev{opacity:0;transform:translateY(6px);transition:opacity .5s,transform .5s}.fig .ev.on{opacity:1;transform:none}
.fig .ev path{stroke:var(--muted);stroke-width:1;stroke-dasharray:2 3}
.fig .ev circle{fill:var(--surface);stroke:var(--fg);stroke-width:1.5}
.fig .ev text{fill:var(--fg)}.fig .ev .k{fill:var(--accent-ink);font-weight:500}
.fcls{display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:12px}
.fc svg{display:block;width:100%;height:auto;border-bottom:1px solid var(--line)}
.fc .gd{fill:color-mix(in srgb,var(--fg) 16%,var(--surface));stroke:var(--muted);stroke-width:1}
.fc .fw{transform:translateY(92px);transition-delay:calc(var(--i)*.25s)}.fig.on .fc .fw{transform:translateY(var(--y))}
.fc .bt{fill:none;stroke:var(--fg);stroke-width:1.2;transform:translateY(92px);transition:transform 1.1s cubic-bezier(.3,.7,.3,1)}.fig.on .fc .bt{transform:translateY(var(--y))}
.fc b{display:block;font:500 20px Geist,system-ui,sans-serif;margin:8px 0 2px}

/* Voices in the archive: an accordion of files, one open at a time. Closed
   files are narrow spines with the name running upwards; on phones the files
   stack and open downwards. Black, grey and acid, as the tiles. */
.vac{display:flex;gap:8px;height:430px;margin-top:22px;container-type:inline-size}
.vp{position:relative;flex:0 0 56px;min-width:0;border:1px solid var(--line);border-radius:14px;background:var(--surface);overflow:hidden;transition:flex-grow .55s cubic-bezier(.2,.8,.2,1),flex-basis .55s cubic-bezier(.2,.8,.2,1),border-color .2s}
.vp.open{flex:1 1 0;background:radial-gradient(60% 50% at 0% 0%,color-mix(in srgb,var(--accent) 14%,transparent),transparent 70%),var(--surface)}
.vp:not(.open):hover{border-color:var(--accent)}
.vt{all:unset;box-sizing:border-box;position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;gap:12px;padding:16px 0 14px;cursor:pointer;color:var(--muted);transition:opacity .2s}
.vt:focus-visible{outline:2px solid var(--fg);outline-offset:-5px;border-radius:12px}
.vt .vi,.vh .vi{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.vt .vn{flex:1;writing-mode:vertical-rl;transform:rotate(180deg);font-size:14.5px;letter-spacing:.01em;color:var(--fg);white-space:nowrap;text-align:left;overflow:hidden}
.vp:not(.open):hover .vn{color:var(--fg)}
.vt .vr{font:400 11px "Geist Mono",monospace;color:var(--muted);letter-spacing:.04em}
.vg{width:20px;height:20px;box-sizing:border-box;border-radius:50%;display:grid;place-items:center;font:500 10px "Geist Mono",monospace;color:var(--fg);border:1.3px solid var(--accent);background:color-mix(in srgb,var(--accent) 18%,transparent);flex:none}
.vg.C{background:var(--accent);color:var(--accent-fg)}
.vg.U{border:1.3px dashed var(--muted);background:none}
.vchev{display:none}
.vp.open .vt{opacity:0;visibility:hidden;pointer-events:none}
.vb{position:absolute;top:0;bottom:0;left:0;width:calc(100cqi - (var(--n) - 1) * 64px);box-sizing:border-box;padding:26px 30px 26px;display:flex;flex-direction:column;opacity:0;visibility:hidden;transition:opacity .2s,visibility 0s .2s}
.vp.open .vb{opacity:1;visibility:visible;transition:opacity .35s .25s}
.vb{container-type:inline-size}
/* a narrow open card has no room for the file card: drop it, so it never covers the text */
@container (max-width:480px){.vdos{display:none}.vb h3,.vs,.vf{max-width:none}}

.vb h3{margin:16px 0 10px;font-weight:500;font-size:clamp(24px,2.6vw,32px);letter-spacing:-.025em;line-height:1.1;outline:none;max-width:62%}
.vs{margin:0;color:var(--muted);font-size:14px;line-height:1.4;max-width:min(30em,62%);text-wrap:pretty}
.vf{display:flex;flex-wrap:wrap;gap:8px 26px;margin:20px 0 0;max-width:64%}
.vf dt{font:500 10.5px "Geist Mono",monospace;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:4px}

.vl{display:flex;flex-wrap:wrap;gap:8px;margin-top:auto;position:relative;z-index:2}
.vdos{position:absolute;right:-18px;bottom:-30px;width:170px;height:226px;border-radius:12px;background:var(--raise);border:1px solid var(--line);padding:14px;box-sizing:border-box;transform:rotate(-6deg);transform-origin:50% 100%;box-shadow:0 18px 40px -26px rgba(0,0,0,.5);transition:transform .6s cubic-bezier(.2,.8,.2,1)}
.vp.open:hover .vdos{transform:rotate(-9deg) translateY(-6px)}

.vdos .sil:before{content:"";position:absolute;left:14px;top:0;width:28px;height:28px;border-radius:50%;border:1.4px solid var(--fg)}

.vgr.C{background:var(--accent);color:var(--accent-fg)}

/* The record, in order: a timeline that draws itself in when it comes into
   view; each moment links to its Story page. Scrolls sideways when it does
   not fit, with arrows and swipe. */
.tlnav{display:flex;gap:6px}
.tlb{padding:8px 11px}
.tlb .ico{width:16px;height:16px}
.tl{position:relative;margin-top:22px;margin-left:-14px;-webkit-mask-image:linear-gradient(90deg,#000 92%,transparent);mask-image:linear-gradient(90deg,#000 92%,transparent)}
.tlx{overflow-x:auto;scroll-snap-type:x mandatory;scroll-padding-left:14px;scrollbar-width:none;outline:none;border-radius:12px;padding-left:14px}
.tlx::-webkit-scrollbar{display:none}
.tlx:focus-visible{outline:2px solid var(--fg);outline-offset:4px}
.tlt{position:relative;display:flex;list-style:none;margin:0;padding:0 90px 6px 0;width:max-content}
.tlt:before{content:"";position:absolute;left:0;right:0;top:46px;height:1.5px;background:var(--line)}
.tlp{position:absolute;left:0;right:0;top:46px;height:1.5px;background:var(--accent);transform-origin:left;transition:transform 2.6s cubic-bezier(.3,.6,.2,1)}
.tlh{position:absolute;top:43px;left:0;width:8px;height:8px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 25%,transparent);animation:tl-run 22s linear infinite}
@keyframes tl-run{from{left:0}to{left:calc(100% - 8px)}}
.te{flex:none;width:236px;scroll-snap-align:start;position:relative;z-index:1}
.te>a,.te>div{display:flex;flex-direction:column;gap:0;padding:0 22px 14px 0;color:inherit;text-decoration:none;height:100%;box-sizing:border-box}
.tdt{height:18px;font:500 11px/18px "Geist Mono",monospace;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
.tnode{margin-top:14px;width:30px;height:30px;box-sizing:border-box;border-radius:50%;border:1.4px solid var(--fg);background:var(--bg);display:grid;place-items:center;color:var(--fg);position:relative;transition:transform .5s cubic-bezier(.2,.8,.2,1),background .25s,border-color .25s,opacity .5s}
.tnode svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.tnode.k-flood{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.tnode.k-flood:after{content:"";position:absolute;inset:-1.5px;border-radius:50%;border:1.4px solid var(--accent);animation:tl-ping 2.8s ease-out infinite;pointer-events:none}
.tlab{margin-top:16px;font-size:15px;line-height:1.45;color:var(--fg);text-wrap:pretty;transition:opacity .6s,transform .6s}
.tgo{margin-top:auto;padding-top:14px;font:400 11px "Geist Mono",monospace;letter-spacing:.06em;color:var(--muted);transition:color .2s,opacity .6s,transform .6s}
.tgo i{font-style:normal;display:inline-block;transition:transform .2s}
.te a:hover .tnode{transform:scale(1.12);background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.te a:hover .tgo{color:var(--fg)}

.tgap:after{content:"";position:absolute;left:10px;right:22px;top:46px;border-top:1.5px dashed var(--muted)}

.tl.pre .tlp{transform:scaleX(0)}
.tl.pre .tnode{transform:scale(.4);opacity:0}

.tl.in:not(.done) .tnode{transition-delay:calc(var(--i)*.24s + .2s)}

  ctxEl.innerHTML=`${arr(prev,chevL,'Previous')}<button class="cx-t" type="button" aria-haspopup="dialog" aria-expanded="false" aria-label="${esc(lab)}. Open the contents"><span>${esc(lab)}</span><i class="chev" aria-hidden="true"></i></button>${arr(next,chevR,'Next')}${prog?'<div class="cx-p" aria-hidden="true"><i></i></div>':''}`;
  $('.cx-t',ctxEl).onclick=sheetOpen;ctxProg()}
function ctxProg(){if(!ctxEl.classList.contains('prog'))return;const a=$('.sprose');if(!a)return;const r=a.getBoundingClientRect(),vh=innerHeight;
  const p=Math.min(1,Math.max(0,(vh*.35-r.top)/Math.max(1,r.height-vh*.5)));ctxEl.style.setProperty('--p',p.toFixed(4))}
addEventListener('scroll',ctxProg,{passive:true});addEventListener('resize',ctxProg,{passive:true});
function sheetOpen(){if(!ctxBody)return;shLast=document.activeElement;$('#sh-t').textContent=ctxTitle;const b=$('.sh-b',shEl);b.innerHTML=ctxBody().replace(/ name="/g,' name="sh-');if(!$('details[open]',b)){const d=$('details',b);if(d)d.open=true}
  shEl.hidden=false;document.body.style.overflow='hidden';const t=$('.cx-t',ctxEl);t&&t.setAttribute('aria-expanded','true');
  requestAnimationFrame(()=>{shEl.classList.add('on');const c=$('a.on',b);if(c)c.scrollIntoView({block:'center'});$('.sh-x',shEl).focus()})}
function sheetClose(keepFocus){if(shEl.hidden)return;shEl.classList.remove('on');document.body.style.overflow='';const t=$('.cx-t',ctxEl);t&&t.setAttribute('aria-expanded','false');
  setTimeout(()=>{if(!shEl.classList.contains('on'))shEl.hidden=true},matchMedia('(prefers-reduced-motion:reduce)').matches?0:320);if(!keepFocus&&shLast&&shLast.isConnected)shLast.focus()}
$('.sh-x',shEl).onclick=()=>sheetClose();$('.sh-bd',shEl).onclick=()=>sheetClose();
shEl.addEventListener('click',e=>{if(e.target.closest('a[href^="#"]'))sheetClose(true)});
document.addEventListener('keydown',e=>{if(shEl.hidden)return;if(e.key==='Escape'){e.preventDefault();sheetClose()}
  else if(e.key==='Tab'){const f=[...shEl.querySelectorAll('button,a[href],summary')].filter(x=>x.offsetParent),i=f.indexOf(document.activeElement);if(f.length){e.preventDefault();f[(i+(e.shiftKey?-1:1)+f.length)%f.length].focus()}}});
addEventListener('hashchange',route);
$('#stamp').textContent=DATA.length+' entries, '+MAP.pts.length+' map points';
