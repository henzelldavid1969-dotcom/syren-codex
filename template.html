<title>Syren Codex</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@200..700&family=Geist+Mono:wght@400;500&family=Newsreader:ital,wght@0,400;0,500;1,400&display=swap">
<style>
:root{--bg:#0e0f0f;--surface:#151616;--raise:#1d1f1f;--line:#2a2d2c;--fg:#ededed;--muted:#9ba09e;--accent:#3ecf8e;--accent-fg:#06130d;
--loc:#3ecf8e;--chr:#7aa7ff;--obj:#e3b562;--lor:#c58bd9;--gc:#3ecf8e;--ge:#e3b562;--gu:#e08a7a;--rus:#e5625a;--glow:rgba(62,207,142,.14);--mapbg:#0b0d0d;color-scheme:dark}
@media(prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#fcfcfb;--surface:#f6f6f4;--raise:#ffffff;--line:#e2e3e0;--fg:#161817;--muted:#626865;--accent:#1f9d68;--accent-fg:#ffffff;--loc:#1f9d68;--chr:#3b6fd6;--obj:#a9741a;--lor:#9345ab;--gc:#1f9d68;--ge:#a9741a;--gu:#c0503f;--rus:#c9382f;--glow:rgba(31,157,104,.10);--mapbg:#f1f2ef;color-scheme:light}}
:root[data-theme="light"]{--bg:#fcfcfb;--surface:#f6f6f4;--raise:#ffffff;--line:#e2e3e0;--fg:#161817;--muted:#626865;--accent:#1f9d68;--accent-fg:#ffffff;--loc:#1f9d68;--chr:#3b6fd6;--obj:#a9741a;--lor:#9345ab;--gc:#1f9d68;--ge:#a9741a;--gu:#c0503f;--rus:#c9382f;--glow:rgba(31,157,104,.10);--mapbg:#f1f2ef;color-scheme:light}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--fg);font:300 15.5px/1.65 Geist,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;cursor:pointer}
.mono{font-family:"Geist Mono",ui-monospace,monospace}
.wrap{max-width:1180px;margin:0 auto;padding:0 max(16px,env(safe-area-inset-left))}
.nav{position:sticky;top:0;z-index:40;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.nav .wrap{display:flex;align-items:center;gap:20px;height:56px}
.brand{display:flex;align-items:center;gap:9px;font-weight:400;letter-spacing:-.01em;white-space:nowrap}
.brand i{width:20px;height:20px;border-radius:5px;background:var(--accent);display:grid;place-items:center}
.brand i:before{content:"";width:8px;height:8px;border:2px solid var(--accent-fg);border-radius:50%}
.links{display:flex;gap:2px;flex:1;overflow-x:auto;scrollbar-width:none}
.links a{padding:6px 10px;border-radius:6px;color:var(--muted);font-size:14px;white-space:nowrap}
.links a:hover,.links a.on{color:var(--fg);background:var(--raise)}
.sbtn{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:6px 10px;color:var(--muted);font-size:13px;min-width:0}
.sbtn:hover{border-color:var(--muted)}
.sbtn kbd,.kbd{font:11px "Geist Mono",monospace;border:1px solid var(--line);border-radius:4px;padding:1px 5px;color:var(--muted)}
.btn{display:inline-flex;align-items:center;gap:8px;border-radius:8px;padding:9px 16px;font-weight:400;font-size:14px;border:1px solid var(--line);background:var(--raise)}
.btn:hover{border-color:var(--muted)}
.btn.p{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.btn.p:hover{filter:brightness(1.08)}
.story{font-size:13px;color:var(--muted);white-space:nowrap}
.story:hover{color:var(--fg)}
@media(max-width:760px){.sbtn span.t,.sbtn kbd,.story{display:none}.nav .wrap{gap:10px}}
.hero{position:relative;padding:96px 0 48px;text-align:center;background:radial-gradient(60% 70% at 50% 0%,var(--glow),transparent 70%)}.hero:before{content:'';position:absolute;inset:0;background-image:radial-gradient(var(--line) 1px,transparent 1px);background-size:22px 22px;-webkit-mask-image:radial-gradient(60% 80% at 50% 20%,#000,transparent 75%);mask-image:radial-gradient(60% 80% at 50% 20%,#000,transparent 75%);opacity:.7;pointer-events:none}.hero .wrap{position:relative}.ico{width:1em;height:1em;stroke:currentColor;fill:none;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round;flex:none}.card .ic .ico{width:19px;height:19px}.card .arr{position:absolute;top:22px;right:22px;color:var(--muted);transition:transform .15s,color .15s}a.card:hover .arr{color:var(--c);transform:translate(2px,-2px)}.sugg{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:14px}.sugg button{background:none;border:1px solid var(--line);border-radius:99px;padding:4px 12px;font-size:13px;color:var(--muted)}.sugg button:hover{color:var(--fg);border-color:var(--muted)}.sechead{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:6px}
.pill{display:inline-flex;gap:8px;align-items:center;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:4px 12px 4px 6px;font-size:13px;color:var(--muted)}
.pill b{background:var(--accent);color:var(--accent-fg);border-radius:99px;padding:0 8px;font-weight:500;font-size:12px}
h1{font-size:clamp(36px,6.2vw,66px);line-height:1.06;letter-spacing:-.04em;font-weight:300;margin:22px auto 0;max-width:15em}
h1 em{font-style:normal;color:var(--accent);display:block;font-weight:300}
.lede{color:var(--muted);font-size:clamp(16px,2vw,19px);max-width:36em;margin:20px auto 0}
.cta{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:28px}
.herosearch{max-width:560px;margin:26px auto 0}
.bigs{width:100%;display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:15px 18px;box-shadow:0 8px 30px -12px rgba(0,0,0,.25);font-weight:300;font-size:16px;color:var(--muted);text-align:left}
.bigs:hover{border-color:var(--muted)}
.bigs span{flex:1}
.sec{padding:36px 0}
.sec h2{font-size:clamp(26px,3.4vw,36px);letter-spacing:-.03em;font-weight:300;margin:0 0 6px}
.sec .sub{color:var(--muted);margin:0 0 22px;max-width:40em}
.eyebrow{font:500 12px "Geist Mono",monospace;text-transform:uppercase;letter-spacing:.08em;color:var(--accent);margin-bottom:10px}
.bento{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.card{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:24px;overflow:hidden;display:flex;flex-direction:column;gap:10px;min-height:230px;transition:border-color .15s,transform .15s}
a.card:hover{border-color:var(--c,var(--accent));transform:translateY(-2px)}
.card:before{content:"";position:absolute;inset:0;background:radial-gradient(70% 60% at 0% 0%,color-mix(in srgb,var(--c) 14%,transparent),transparent 70%);pointer-events:none}
.card .ic{width:40px;height:40px;border-radius:10px;border:1px solid color-mix(in srgb,var(--c) 35%,var(--line));display:grid;place-items:center;color:var(--c);font:500 14px "Geist Mono",monospace;background:color-mix(in srgb,var(--c) 10%,transparent)}
.card h3{margin:8px 0 0;font-size:18px;letter-spacing:-.01em;font-weight:400}
.card p{margin:0;color:var(--muted);font-size:14px;flex:1}
.card .foot{display:flex;justify-content:space-between;align-items:center;font:12px "Geist Mono",monospace;color:var(--muted)}
.card .n{color:var(--c)}
.card.wide{grid-column:span 2}
@media(max-width:960px){.bento{grid-template-columns:repeat(2,1fr)}}
@media(max-width:520px){.bento{grid-template-columns:1fr}.card.wide{grid-column:auto}}
.mediarow{display:flex;gap:8px;flex-wrap:wrap}
.chip .ico{width:13px;height:13px}.chip{display:inline-flex;gap:6px;align-items:center;border:1px solid var(--line);border-radius:99px;padding:3px 10px;font-size:12px;color:var(--muted);background:var(--raise)}
.mapwrap{display:grid;grid-template-columns:300px 1fr;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--mapbg);height:var(--mh,560px)}
.mapwrap.compact{grid-template-columns:1fr}
.mapwrap.compact .mpanel{display:none}
.mpanel{border-right:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;min-height:0}
.mpanel .ms{padding:10px;border-bottom:1px solid var(--line)}
.mpanel input{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:8px 10px;color:var(--fg);font:inherit;font-size:14px}
.mpanel input:focus,.palette input:focus,.fin:focus{outline:2px solid var(--accent);outline-offset:-1px}
.mlist{overflow:auto;flex:1;padding:6px}
.mlist h4{font:500 11px "Geist Mono",monospace;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:12px 8px 4px}
.mi{display:flex;gap:10px;align-items:center;width:100%;text-align:left;background:none;border:0;border-radius:6px;padding:7px 8px;font-size:14px}
.mi:hover,.mi.on{background:var(--raise)}
.dot{width:10px;height:10px;border-radius:50%;flex:none;background:var(--dc)}
.mi small{margin-left:auto;font:11px "Geist Mono",monospace;color:var(--muted)}
.mcanvas{position:relative;min-height:0;overflow:hidden;touch-action:none;cursor:grab}
.mcanvas:active{cursor:grabbing}
.mcanvas svg{width:100%;height:100%;display:block}
.mcanvas svg .gr{stroke:var(--line);stroke-width:.4;vector-effect:non-scaling-stroke;opacity:.7}
.mcanvas svg .perim{fill-opacity:.05;stroke-width:1.4;vector-effect:non-scaling-stroke;stroke-linejoin:round}
.mcanvas svg .rt{fill:none;stroke:var(--accent);stroke-width:2;vector-effect:non-scaling-stroke;stroke-dasharray:6 4;stroke-linecap:round}
.mcanvas svg circle.pt{r:calc(6px*var(--k));fill:var(--dc);stroke:var(--mapbg);stroke-width:calc(1.6px*var(--k));cursor:pointer}
.mcanvas svg circle.pt.sq{r:calc(4.4px*var(--k))}
.mcanvas svg circle.halo{r:calc(13px*var(--k));fill:none;stroke:var(--dc);stroke-width:calc(1.5px*var(--k));opacity:.9}
.mcanvas svg circle.hit{r:calc(14px*var(--k));fill:transparent;cursor:pointer}
.mcanvas svg text{font:500 calc(11.5px*var(--k)) Geist,sans-serif;fill:var(--fg);paint-order:stroke;stroke:var(--mapbg);stroke-width:calc(3px*var(--k));pointer-events:none}
.mtools{position:absolute;top:10px;left:10px;display:flex;gap:6px;flex-wrap:wrap;max-width:calc(100% - 70px)}
.mtools .chip{cursor:pointer;background:color-mix(in srgb,var(--surface) 90%,transparent);backdrop-filter:blur(6px)}
.mtools .chip.off{opacity:.45;text-decoration:line-through}
.mzoom{position:absolute;top:10px;right:10px;display:flex;flex-direction:column;gap:4px}
.mzoom button{width:32px;height:32px;border-radius:7px;border:1px solid var(--line);background:var(--surface);font-size:17px;line-height:1}
.mzoom button:hover{border-color:var(--muted)}
.mcard{position:absolute;left:10px;right:10px;bottom:10px;max-width:420px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:none;box-shadow:0 12px 40px rgba(0,0,0,.35)}
.mcard.on{display:block}
.mcard h4{font-weight:400;margin:0 0 2px;font-size:16px;letter-spacing:-.01em}
.mcard p{margin:0 0 10px;color:var(--muted);font-size:13.5px}
.mcard .x{position:absolute;top:8px;right:10px;background:none;border:0;color:var(--muted);font-size:18px}
.mnote{position:absolute;right:10px;bottom:8px;font-size:11px;color:var(--muted);max-width:50%;text-align:right;pointer-events:none}
@media(max-width:760px){.mapwrap{grid-template-columns:1fr;grid-template-rows:auto 1fr;height:auto}.mapwrap .mcanvas{height:62vh;order:-1}.mpanel{border-right:0;border-top:1px solid var(--line);max-height:300px}.mnote{display:none}}
.docs{display:grid;grid-template-columns:260px minmax(0,1fr) 250px;gap:36px;padding:28px 0 70px}
.docs.two{grid-template-columns:260px minmax(0,1fr)}
.side{position:sticky;top:76px;align-self:start;max-height:calc(100vh - 96px);overflow:auto;padding-right:6px}
.side h5{font:500 11px "Geist Mono",monospace;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:16px 8px 6px}
.side a{display:flex;gap:8px;align-items:center;padding:5px 8px;border-radius:6px;color:var(--muted);font-size:14px}
.side a:hover,.side a.on{color:var(--fg);background:var(--raise)}
.rail{position:sticky;top:76px;align-self:start;font-size:13.5px}
.rail .box{border:1px solid var(--line);border-radius:10px;padding:14px;background:var(--surface);margin-bottom:12px}
.rail h6{margin:0 0 8px;font:500 11px "Geist Mono",monospace;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.rail p{margin:0;color:var(--muted)}
.rail a.x{display:block;padding:3px 0;color:var(--fg)}
.rail a.x:hover{color:var(--accent)}
@media(max-width:1020px){.docs,.docs.two{grid-template-columns:minmax(0,1fr)}.side,.rail{position:static;max-height:none}.side{display:none}}
.crumb{font:12px "Geist Mono",monospace;color:var(--muted);margin-bottom:10px}
.crumb a:hover{color:var(--fg)}
.ph{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:6px}
.tag{font:500 11px "Geist Mono",monospace;letter-spacing:.04em;border-radius:5px;padding:2px 7px;border:1px solid color-mix(in srgb,var(--c) 40%,var(--line));color:var(--c);background:color-mix(in srgb,var(--c) 9%,transparent)}
.main h1.t{font-weight:300;font-size:clamp(30px,4.4vw,44px);margin:6px 0 10px;text-align:left;max-width:none;letter-spacing:-.03em}
.main .sum{font-size:18px;color:var(--muted);margin:0 0 22px;line-height:1.5}
.prose{font:400 18px/1.75 Newsreader,Georgia,serif;max-width:40em}
.prose p{margin:0 0 1em}
.media{display:grid;gap:12px;margin:0 0 24px}
.media img,.media video{width:100%;border-radius:10px;border:1px solid var(--line)}
.media audio{width:100%}
.media figcaption{font-size:13px;color:var(--muted);margin-top:6px}
.prose h2{font:400 22px/1.3 Geist,system-ui,sans-serif;letter-spacing:-.01em;margin:1.6em 0 .6em}
.prose blockquote{margin:1.2em 0;padding:0 0 0 18px;border-left:2px solid var(--line);color:var(--muted)}
.prose blockquote p{margin:0 0 .6em}
.prose table{display:block;overflow-x:auto;border-collapse:collapse;font:400 14px/1.5 Geist,system-ui,sans-serif;margin:0 0 1.2em}
.prose th,.prose td{border:1px solid var(--line);padding:7px 10px;text-align:left;vertical-align:top}
.prose th{background:var(--surface);font-weight:500}
.prose ul,.prose ol{padding-left:1.2em;margin:0 0 1em}
.prose .spk{font:400 12.5px "Geist Mono",monospace;letter-spacing:.04em;color:var(--muted);margin:0 0 1.4em}
.prose .spk strong{color:var(--accent);font-weight:500}
.prose .brk{text-align:center;color:var(--muted);letter-spacing:.4em;margin:1.8em 0}
.pager{display:flex;gap:12px;margin-top:40px;padding-top:22px;border-top:1px solid var(--line);max-width:40em}
.pager a{display:flex;flex-direction:column;gap:3px;border:1px solid var(--line);border-radius:10px;padding:12px 16px;background:var(--surface);min-width:0;flex:1}
.pager a:hover{border-color:var(--accent)}
.pager a.nx{text-align:right}
.pager small{font:11px "Geist Mono",monospace;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.toc{max-width:40em;margin-top:30px}
.toc h5{font:500 11px "Geist Mono",monospace;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:22px 0 8px}
.tagline{font-weight:400}.tagline strong{font-weight:500}
.g{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:5px;font:600 11px "Geist Mono",monospace;color:#07120c;background:var(--gc)}
.g.E{background:var(--ge)}.g.U{background:var(--gu)}
.gl{display:flex;gap:6px;align-items:center}
.ctl{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:0 0 16px}
.fin{flex:1;min-width:200px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 12px;color:var(--fg);font:inherit;font-size:14px}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{background:var(--surface);border:0;padding:8px 12px;font-size:13px;color:var(--muted);border-right:1px solid var(--line)}
.seg button:last-child{border:0}
.seg button.on{background:var(--raise);color:var(--fg)}
.row{display:block;border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:8px;background:var(--surface)}
.row:hover{border-color:var(--c,var(--accent))}
.row .rt2{display:flex;gap:10px;align-items:center;justify-content:space-between}
.row b{font-weight:400;font-size:16px;letter-spacing:-.01em}
.row p{margin:4px 0 0;color:var(--muted);font-size:14px}
mark{background:color-mix(in srgb,var(--accent) 28%,transparent);color:inherit;border-radius:2px}
.empty{color:var(--muted);padding:30px 0;text-align:center}
.ov{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.55);backdrop-filter:blur(3px);display:none;align-items:flex-start;justify-content:center;padding:10vh 16px 0}
.ov.on{display:flex}
.palette{width:100%;max-width:640px;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:0 30px 80px rgba(0,0,0,.5);overflow:hidden}
.palette input{width:100%;background:none;border:0;border-bottom:1px solid var(--line);padding:16px 18px;font:inherit;font-size:17px;color:var(--fg);outline:none}
.pf{display:flex;gap:6px;padding:8px 12px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.pf .chip{cursor:pointer}.pf .chip.on{border-color:var(--accent);color:var(--fg)}
.pr{max-height:52vh;overflow:auto;padding:6px}
.pi{display:flex;gap:12px;align-items:flex-start;padding:9px 10px;border-radius:8px}
.pi.sel{background:var(--raise)}
.pi .dot{margin-top:7px}
.pi b{font-weight:400}
.pi p{margin:1px 0 0;color:var(--muted);font-size:13px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pi small{margin-left:auto;font:11px "Geist Mono",monospace;color:var(--muted);white-space:nowrap;padding-top:3px}
footer{border-top:1px solid var(--line);padding:28px 0 40px;color:var(--muted);font-size:13px}
footer .wrap{display:flex;gap:16px;justify-content:space-between;flex-wrap:wrap}
.tog{background:none;border:1px solid var(--line);border-radius:7px;width:32px;height:32px;color:var(--muted)}

/* supabase-style home */
.hero{text-align:left;padding:72px 0 40px;background:none}
.hero:before{display:none}
.h2col{display:grid;grid-template-columns:1.5fr 1fr;gap:48px;align-items:end}
.hero h1{margin:0;max-width:none;font-weight:400;font-size:clamp(34px,4.2vw,52px);letter-spacing:-.035em;line-height:1.08}
.hero h1 em{font-weight:400}
.hero .lede{margin:0;max-width:30em;font-size:16px}
.hero .cta{justify-content:flex-start;margin-top:22px}
@media(max-width:860px){.h2col{grid-template-columns:1fr;gap:20px}}
.grid7{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--bg)}
.cell{position:relative;padding:22px 22px 0;min-height:290px;display:flex;flex-direction:column;border-right:1px solid var(--line);border-bottom:1px solid var(--line);overflow:hidden;background:var(--bg);transition:background .15s}
.cell:hover{background:var(--surface)}
.cell.w2{grid-column:span 2}
.grid7{margin-right:0}.cell{border-top:0;border-left:0}button.cell{width:100%;border-radius:0;font:inherit}.grid7{border-right:0;border-bottom:0}
.cell h3{margin:0 0 6px;font-size:15px;font-weight:400;display:flex;gap:8px;align-items:center}
.cell h3 .ico{color:var(--c);width:16px;height:16px}
.cell p{margin:0;font-size:14px;color:var(--muted);max-width:30em}
.cell p b{color:var(--fg);font-weight:500}
.cell .art{margin-top:auto;padding:16px 0 22px;display:flex;align-items:flex-end;justify-content:center;min-height:130px}
.cell .art svg{max-width:100%;height:auto}
@media(max-width:960px){.grid7{grid-template-columns:repeat(2,1fr)}.cell.w2{grid-column:span 2}}
@media(max-width:560px){.grid7{grid-template-columns:1fr}.cell.w2{grid-column:auto}}
.av{display:flex}.av i{width:34px;height:34px;border-radius:50%;border:2px solid var(--bg);margin-left:-8px;display:grid;place-items:center;font:500 12px "Geist Mono",monospace;font-style:normal;color:#fff}
.av i:first-child{margin-left:0}

  h+=`<div class="imgs">${im.map(x=>`<figure title="${esc([x.caption,x.credit].filter(Boolean).join(' · '))}"><a href="${esc(x.src)}" target="_blank" rel="noopener"><img src="${esc(x.src)}" alt="${esc(x.alt||x.caption||d.name)}" loading="lazy"></a></figure>`).join('')}${Array.from({length:10-im.length},(_,i)=>{const n=im.length+i;return `<div class="slot">${n===0?ico('plus'):ico('image')}<span>${n===0?'Add image':String(n+1).padStart(2,'0')}</span></div>`}).join('')}</div>`;
  if(im.some(x=>x.caption||x.credit))h+=`<div class="bm mono" style="font-size:12px;color:var(--muted);margin-top:8px">${im.map((x,i)=>x.caption||x.credit?`${String(i+1).padStart(2,'0')} ${esc([x.caption,x.credit&&'Credit: '+x.credit].filter(Boolean).join('. '))}`:'').filter(Boolean).join('<br>')}</div>`;
  h+=hd('Audio',!au.length,au.length?au.length+' file'+(au.length>1?'s':''):'WAV or MP3');
  h+=`<div class="mp">${au.length?au.map((x,i)=>`<div class="blk ${i%2?'alt':''}"><div class="bh"><span>${i===0?'<em>':''}${esc(x.label||'Audio')}${i===0?'</em>':''}</span><small>${esc(x.meta||'')}</small></div>${x.note?`<div class="bm">${esc(x.note)}</div>`:'<div style="height:10px"></div>'}<audio controls preload="none" src="${esc(x.src)}"></audio></div>`).join(''):`<div class="blk"><div class="bh"><span>Audio · <em>Recording</em></span><small>0:00 · WAV 24bit/96kHz</small></div><div class="bm">Source · Place · Date · Recordist</div><audio class="dis" controls></audio></div>`}</div>`;
  h+=hd('Video',!vi.length,vi.length?vi.length+' file'+(vi.length>1?'s':''):'MP4');
  h+=vi.length?vi.map(x=>`<div class="mp" style="margin-bottom:10px"><div class="blk"><video controls preload="metadata" src="${esc(x.src)}"></video>${x.caption?`<div class="bm">${esc(x.caption)}</div>`:''}</div></div>`).join(''):`<div class="vph">${ico('play')}</div>`;
  h+=hd('Files',!fi.length,fi.length?fi.length+' file'+(fi.length>1?'s':''):'PDF');
  h+=fi.length?`<div class="files">${fi.map(x=>{const ext=(x.src.split('?')[0].match(/\.([a-z0-9]+)$/i)||[,'file'])[1].toUpperCase();return `<a class="fl" href="${esc(x.src)}" target="_blank" rel="noopener">${ico('file')}<div><b>${esc(x.label)}</b><small>${[ext,x.pages?x.pages+' page'+(x.pages>1?'s':''):'',x.size?kb(x.size):''].filter(Boolean).join(' · ')}</small></div><span class="go">Open</span></a>`}).join('')}</div>`:`<div class="fl dash">${ico('file')}<div><b>Document name.pdf</b><small>PDF · 0 pages · 0 MB</small></div></div>`;
  return h}
const longDate=s=>{if(!s)return '';const [y,m,dd]=s.split('-');return `${+dd} ${['January','February','March','April','May','June','July','August','September','October','November','December'][m-1]} ${y}`};
function entry(id){
  const d=BYID[id];if(!d){home();return}const t=d.type;const rel=d.rel.filter(r=>BYID[r.id]);
  const own=MAP.pts.some(p=>p.e===d.id);const place=!own&&rel.map(r=>r.id).find(i=>MAP.pts.some(p=>p.e===i));
  const coords=t==='LOC'&&d.facts.lat!=null;
  const mapBox=own?`<a class="btn p" href="#map-${d.id}" style="width:100%;justify-content:center">${ico('pin')} Show on map</a>`:place?`<a class="btn" href="#map-${place}" style="width:100%;justify-content:center">${ico('pin')} ${esc(short(BYID[place].name))} on the map</a>`:coords?`<a class="btn" href="#map" style="width:100%;justify-content:center">${ico('map')} Open the map</a>`:'';
  const groups=[...new Set(rel.map(r=>r.label))];
  const tags=[META[t].label,d.mark||META[t].mark,...rel.slice(0,6).map(r=>BYID[r.id])];
  $('#app').innerHTML=`<div class="wrap"><div class="docs">${side(t,id)}<article class="main"><div class="crumb"><a href="#home">Codex</a> / <a href="#c-${t.toLowerCase()}">${META[t].label}</a> / ${d.ref.replace('SYNPTCL/','')}</div>
    <div class="eref">${d.ref.replace('SYNPTCL/','').replace('/','-')}</div><h1 class="t">${esc(d.name)}</h1><p class="sum it">${esc(d.summary)}</p>
    ${facts(d)}
    <div class="tags">${tags.map(x=>typeof x==='string'?`<span>${esc(x.toLowerCase())}</span>`:`<a href="#e-${x.id}">${esc(short(x.name).toLowerCase())}</a>`).join('')}</div>
    <div class="prose"><p>${esc(d.entry)}</p></div>
    ${mediaBlocks(d)}</article>
    <aside class="rail">
      ${mapBox?`<div class="box"><h6>Map</h6>${mapBox}</div>`:''}
      <div class="box"><h6>Evidence</h6><p>${d.grade?`<span class="gl"><span class="g ${d.grade}">${d.grade}</span> ${GRADE[d.grade]}${d.sources!=null?` · ${d.sources} source${d.sources===1?'':'s'}`:''}</span>`:'Not yet graded.'}</p>${d.reliability?`<p style="margin-top:8px">${esc(d.reliability)}</p>`:''}</div>
      <div class="box"><h6>Appears in</h6>${d.apps.length?d.apps.map(a=>`<a class="x" href="#story-${a.s}">${ico('book')} ${esc(a.t)}</a>`).join(''):''}${d.appears?`<p style="margin-top:${d.apps.length?8:0}px">${esc(d.appears)}</p>`:'<p>Not recorded</p>'}</div>
      <div class="box"><h6>Connected entries</h6>${rel.length?groups.map(g=>`${groups.length>1||g!=='Connected'?`<div class="grp">${esc(g)}</div>`:''}${rel.filter(r=>r.label===g).map(r=>`<a class="x" href="#e-${r.id}">${dot(BYID[r.id].type)} ${esc(short(BYID[r.id].name))}</a>`).join('')}`).join(''):`<p>${esc(d.xnote||'None recorded.')}</p>`}</div>
      <div class="box"><h6>Record</h6><dl><dt>Status</dt><dd>${esc(d.status)}</dd><dt>Updated</dt><dd>${longDate(d.updated)||'Not recorded'}</dd>${d.aliases?`<dt>Also</dt><dd>${esc(d.aliases)}</dd>`:''}</dl>${d.note?`<p style="margin-top:10px">${esc(d.note)}</p>`:''}</div>
    </aside></div></div>`}
/* story */
let STORY=null,storyLoad=null;
const getStory=()=>storyLoad||(storyLoad=fetch('story.json').then(r=>{if(!r.ok)throw new Error(r.status);return r.json()}).then(s=>STORY=s).catch(e=>{storyLoad=null;throw e}));
const SGROUP={front:'Before the story',story:'The story',back:'After the story'};
function storySide(cur){return `<aside class="side">${Object.keys(SGROUP).map(g=>`<h5>${SGROUP[g]}</h5>`+STORY.pages.filter(p=>p.group===g).map(p=>`<a href="#story-${p.slug}" class="${p.slug===cur?'on':''}"><span>${esc(p.title)}</span></a>`).join('')).join('')}</aside>`}
function storyHome(){const S=STORY;const start=S.pages.find(p=>p.slug==='foreword')||S.pages.find(p=>p.group==='story');
  $('#app').innerHTML=`<div class="wrap"><div class="docs two">${storySide('')}<div class="main"><div class="crumb"><a href="#home">Codex</a> / Story</div><div class="ph"><span class="tag" style="--c:var(--accent)">MANUSCRIPT</span><span class="mono" style="font-size:12px;color:var(--muted)">First draft</span></div><h1 class="t">${esc(S.name)}</h1><p class="sum">${esc(S.subtitle)}</p>
    <div class="prose"><div class="tagline">${S.tagline}</div>${S.blurb}</div>
    <div class="cta" style="justify-content:flex-start"><a class="btn p" href="#story-${start.slug}">${ico('book')} Start reading</a><a class="btn" href="#map">${ico('map')} Open the map</a></div>
    <div class="toc">${Object.keys(SGROUP).map(g=>`<h5>${SGROUP[g]}</h5>`+S.pages.filter(p=>p.group===g).map(p=>`<a class="row" href="#story-${p.slug}"><b>${esc(p.title)}</b></a>`).join('')).join('')}</div></div></div></div>`}
function storyPage(slug){const P=STORY.pages,i=P.findIndex(p=>p.slug===slug);if(i<0){storyHome();return}const p=P[i],pv=P[i-1],nx=P[i+1];
  $('#app').innerHTML=`<div class="wrap"><div class="docs two">${storySide(slug)}<article class="main"><div class="crumb"><a href="#home">Codex</a> / <a href="#story">Story</a> / ${esc(p.title.split(':')[0])}</div><h1 class="t">${esc(p.title)}</h1>
    <div class="prose">${p.html}</div>
    <nav class="pager">${pv?`<a href="#story-${pv.slug}"><small>Previous</small>${esc(pv.title)}</a>`:'<a href="#story"><small>Back to</small>Contents</a>'}${nx?`<a class="nx" href="#story-${nx.slug}"><small>Next</small>${esc(nx.title)}</a>`:'<a class="nx" href="#story"><small>Back to</small>Contents</a>'}</nav></article></div></div>`}
function storyRoute(h){const draw=()=>{h==='story'?storyHome():storyPage(h.slice(6));scrollTo(0,0)};
  if(STORY)return draw();
  $('#app').innerHTML='<div class="wrap"><div class="empty">Opening the manuscript…</div></div>';
  getStory().then(()=>{if((location.hash||'#home').slice(1)===h)draw()}).catch(()=>{$('#app').innerHTML='<div class="wrap"><div class="empty">The manuscript could not be loaded. Please reload the page.</div></div>'})}
function route(){const h=(location.hash||'#home').slice(1);navPaint(h);
  if(h==='story'||h.startsWith('story-'))storyRoute(h);
  else if(h==='map')mapView();else if(h.startsWith('map-'))mapView(h.slice(4));
  else if(h.startsWith('c-')&&META[h.slice(2).toUpperCase()])cat(h.slice(2));
  else if(h.startsWith('e-'))entry(h.slice(2));else home();
  scrollTo(0,0)}
addEventListener('hashchange',route);
$('#stamp').textContent=DATA.length+' entries, '+MAP.pts.length+' map points';
route();
</script>
