<!doctype html>
<html lang="en-GB">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Syren Codex Admin</title>
<link rel="icon" href="/favicon.ico" sizes="32x32">
<link rel="icon" type="image/svg+xml" href="/brand/syren-icon-dark.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@300..700&family=Geist+Mono:wght@400;500&display=swap">
<style>
:root{--bg:#0e0f0f;--surface:#151616;--raise:#1d1f1f;--line:#2a2d2c;--fg:#ededed;--muted:#9ba09e;--accent:#B8DF0D;--accent-fg:#141a00;--accent-ink:#B8DF0D;--warn:#e0a341;--bad:#e5735f;--field:#111212;color-scheme:dark}
@media(prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#fcfcfb;--surface:#f6f6f4;--raise:#ffffff;--line:#e2e3e0;--fg:#161817;--muted:#626865;--accent-ink:#161817;--warn:#8a5a00;--bad:#b23a26;--field:#ffffff;color-scheme:light}}
:root[data-theme="light"]{--bg:#fcfcfb;--surface:#f6f6f4;--raise:#ffffff;--line:#e2e3e0;--fg:#161817;--muted:#626865;--accent-ink:#161817;--warn:#8a5a00;--bad:#b23a26;--field:#ffffff;color-scheme:light}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 Geist,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
.mono,.ref{font-family:"Geist Mono",ui-monospace,monospace}
.ico{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;flex:none}
[hidden]{display:none!important}

/* Buttons */
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--raise);border-radius:8px;padding:7px 13px;font-size:14px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--accent);color:var(--accent-fg);border-color:var(--accent);font-weight:600}
.btn.pri:hover{filter:brightness(1.05)}
.btn.ghost{background:none;border-color:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--fg);border-color:var(--line)}
.btn.sm{padding:4px 9px;font-size:13px;border-radius:7px}
.btn.icon{padding:5px;border-radius:7px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.badge{display:inline-flex;align-items:center;justify-content:center;min-width:20px;height:20px;padding:0 6px;border-radius:99px;font:500 11px "Geist Mono",monospace;background:var(--accent-fg);color:var(--accent)}
.btn:not(.pri) .badge{background:var(--accent);color:var(--accent-fg)}

/* Sign in */
.auth{min-height:100vh;display:grid;place-items:center;padding:24px 16px}
.authcard{width:100%;max-width:400px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:32px 28px}
.eyebrow{font:500 11px "Geist Mono",monospace;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:0 0 18px}
.authcard h1{font-size:26px;font-weight:600;margin:0 0 8px;letter-spacing:-.01em}
.authcard p{color:var(--muted);margin:0 0 20px}
.authcard form{display:grid;gap:12px}
.authcard .btn{justify-content:center;padding:10px}
.note{border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:8px;padding:10px 12px;font-size:14px;background:var(--raise);color:var(--fg)}
.note.bad{border-left-color:var(--bad)}

/* Shell */
.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;border-right:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;padding:18px 12px}
.brand{display:flex;align-items:center;gap:10px;padding:2px 8px 18px;font-weight:600;letter-spacing:-.01em}
.brand img{width:28px;height:28px;flex:none}
.brand small{display:block;font:500 10.5px "Geist Mono",monospace;letter-spacing:.1em;color:var(--muted);text-transform:uppercase}
.nav{display:grid;gap:2px}
.nav a{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:7px;color:var(--muted);font-size:14px}
.nav a:hover{color:var(--fg);background:var(--raise)}
.nav a.on{color:var(--fg);background:var(--raise);box-shadow:inset 2px 0 0 var(--accent)}
.nav a .soon{margin-left:auto;font:10.5px "Geist Mono",monospace;color:var(--muted);border:1px dashed var(--line);border-radius:99px;padding:0 7px}
.nav a.off{pointer-events:none;opacity:.65}
.nav h4{font:500 10.5px "Geist Mono",monospace;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:18px 10px 6px}
.sidefoot{margin-top:auto;border-top:1px solid var(--line);padding:12px 8px 0;font-size:13px;color:var(--muted);display:grid;gap:8px}
.sidefoot .who{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sidefoot .row{display:flex;gap:6px;flex-wrap:wrap}
.main{min-width:0}
.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:12px;padding:12px 28px;border-bottom:1px solid var(--line);background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px)}
.crumbs{display:flex;align-items:center;gap:8px;min-width:0;font-size:14px;color:var(--muted)}
.crumbs b{color:var(--fg);font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.top .acts{margin-left:auto;display:flex;gap:8px;align-items:center}
.view{padding:28px;max-width:1180px}
.mnav{display:none}

h1.pt{font-size:26px;font-weight:600;letter-spacing:-.015em;margin:0 0 4px}
.lede{color:var(--muted);margin:0 0 24px}

/* Cards and grids */
.grid{display:grid;gap:16px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px 20px;min-width:0}
.card h3{font:500 11px "Geist Mono",monospace;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:0 0 12px;display:flex;align-items:center;gap:8px}
.card h3 .r{margin-left:auto;text-transform:none;letter-spacing:0}
.stat b{display:block;font-size:30px;font-weight:600;letter-spacing:-.02em;line-height:1.1}
.stat .bar{display:flex;height:4px;border-radius:2px;overflow:hidden;background:var(--line);margin:12px 0 8px}
.stat .bar i{display:block;background:var(--fg)}
.stat .bar i.f{background:var(--accent)}
.stat .leg{display:flex;gap:12px;flex-wrap:wrap;font:12px "Geist Mono",monospace;color:var(--muted)}
.pub{display:flex;gap:20px;align-items:center;flex-wrap:wrap}
.pub .txt{flex:1;min-width:220px}
.pub .txt b{font-size:17px;font-weight:600}
.pub .txt p{margin:4px 0 0;color:var(--muted);font-size:14px}
.list{display:grid}
.li{display:flex;align-items:center;gap:12px;padding:9px 2px;border-top:1px solid var(--line);font-size:14px;min-width:0}
.li:first-child{border-top:0}
.li:hover .nm{text-decoration:underline;text-decoration-color:var(--muted);text-underline-offset:3px}
.li .ref{font-size:12px;color:var(--muted);flex:none;width:120px}
.li .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li .meta{font:12px "Geist Mono",monospace;color:var(--muted);flex:none;text-align:right}
.miss{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.tag{font:11px "Geist Mono",monospace;border:1px solid var(--line);border-radius:5px;padding:1px 6px;color:var(--muted);white-space:nowrap}
.tag.warn{border-style:dashed;color:var(--fg)}
.empty{color:var(--muted);font-size:14px;padding:6px 0}

/* Status and grade marks (no colour coding: shape and text only) */
.st{display:inline-flex;align-items:center;gap:6px;font:12px "Geist Mono",monospace;white-space:nowrap}
.st:before{content:'';width:9px;height:9px;border:1.5px solid var(--fg);border-radius:2px;box-sizing:border-box}
.st.Draft:before{border-style:dashed;border-color:var(--muted)}
.st.Filed:before{background:none}
.st.Verified:before{background:var(--accent);border-color:var(--accent-ink)}
.gr{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:5px;font:500 12px "Geist Mono",monospace;border:1.5px solid var(--fg)}
.gr.C{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.gr.E{border-color:var(--accent-ink)}
.gr.U{border-style:dashed}
.gr.none{border:1.5px dashed var(--line);color:var(--muted)}

/* Entries table */
.tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;padding:2px;background:var(--surface);flex-wrap:wrap}
.seg button,.seg label{border:0;background:none;border-radius:7px;padding:5px 11px;font-size:13.5px;color:var(--muted);cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.seg button.on,.seg label.on{background:var(--raise);color:var(--fg);box-shadow:0 0 0 1px var(--line)}
.seg button small{font:11px "Geist Mono",monospace;color:var(--muted)}
.search{flex:1;min-width:200px;display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--field);border-radius:9px;padding:6px 10px;color:var(--muted)}
.search input{border:0;background:none;outline:none;flex:1;min-width:0;color:var(--fg)}
.chk{display:inline-flex;gap:8px;align-items:center;font-size:14px;color:var(--muted);cursor:pointer;user-select:none}
.chk input{accent-color:var(--accent);width:16px;height:16px}
table.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{font:500 11px "Geist Mono",monospace;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr.row{cursor:pointer}
.tbl tr.row:hover td{background:var(--surface)}
.tbl td.ref{font-size:12px;color:var(--muted);white-space:nowrap}
.tbl td .nm{font-weight:500}
.tbl td .sm{display:block;color:var(--muted);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:46ch}
.tbl td.mk{font:12px "Geist Mono",monospace;color:var(--muted);white-space:nowrap}
.tbl td.up{font:12px "Geist Mono",monospace;color:var(--muted);white-space:nowrap}
.tblwrap{border:1px solid var(--line);border-radius:12px;overflow:auto;background:var(--bg)}
.count{font:12px "Geist Mono",monospace;color:var(--muted);margin:0 0 10px}

/* Editor */
.edhead{display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap;margin-bottom:20px}
.edhead .t{flex:1;min-width:240px}
.edhead .ref{font-size:12.5px;color:var(--muted);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.edhead h1{font-size:28px;font-weight:600;letter-spacing:-.015em;margin:6px 0 0;line-height:1.15}
.edgrid{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:20px;align-items:start}
.edside{position:sticky;top:76px;display:grid;gap:16px}
.sec{background:var(--surface);border:1px solid var(--line);border-radius:12px;margin-bottom:16px}
.sec>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px;padding:14px 20px;font-weight:600}
.sec>summary::-webkit-details-marker{display:none}
.sec>summary .n{font:500 11px "Geist Mono",monospace;color:var(--muted);letter-spacing:.06em}
.sec>summary .hint{margin-left:auto;font:400 12px "Geist Mono",monospace;color:var(--muted)}
.sec>summary .chev{transition:transform .15s;color:var(--muted);margin-left:auto}
.sec>summary .hint+.chev{margin-left:10px}
.edside .li .ref{width:auto}
@media(max-width:1100px){.edgrid.tail .edside{order:0}}
.sec[open]>summary .chev{transform:rotate(90deg)}
.sec .body{padding:4px 20px 20px;display:grid;gap:16px;border-top:1px solid var(--line);padding-top:18px}
.fld{display:grid;gap:6px;min-width:0;align-content:start}
.fld>label,.lbl{font-size:13px;font-weight:500;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.req{font:10.5px "Geist Mono",monospace;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
.fld .help{font-size:12.5px;color:var(--muted)}
.fld input[type=text],.fld input[type=number],.fld input[type=email],.fld select,.fld textarea,.inp{width:100%;min-height:38px;border:1px solid var(--line);background:var(--field);border-radius:8px;padding:8px 10px;outline:none;min-width:0}
.fld textarea{resize:vertical;line-height:1.55;min-height:72px}
.fld textarea.long{min-height:280px;font-family:Newsreader,Georgia,serif;font-size:16.5px;line-height:1.6}
.fld input:focus,.fld select:focus,.fld textarea:focus,.inp:focus{border-color:var(--muted);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 25%,transparent)}
.r2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.r3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.cnt{font:11.5px "Geist Mono",monospace;color:var(--muted);margin-left:auto}
.cnt.over{color:var(--bad)}
.lint{display:flex;gap:6px;flex-wrap:wrap}
.lint span{font:11.5px "Geist Mono",monospace;border:1px dashed var(--warn);color:var(--warn);border-radius:5px;padding:1px 7px}
.nr{font:12px "Geist Mono",monospace;color:var(--muted)}

/* Ordered lists inside the editor */
.ol{display:grid;gap:8px}
.oi{display:grid;grid-template-columns:24px minmax(0,1fr) auto;gap:8px;align-items:center;border:1px solid var(--line);background:var(--raise);border-radius:9px;padding:8px 8px 8px 10px}
.oi .ix{font:11px "Geist Mono",monospace;color:var(--muted)}
.oi .mv{display:flex;gap:2px}
.oi .row{display:grid;gap:8px;grid-template-columns:150px minmax(0,1fr) minmax(0,1fr)}
.oi .row.two{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.oi select,.oi input{width:100%;border:1px solid var(--line);background:var(--field);border-radius:7px;padding:6px 8px;font-size:13.5px;outline:none;min-width:0}
.addrow{display:flex;gap:8px;flex-wrap:wrap}
.addrow select{flex:1;min-width:200px}
.inc{font-size:13.5px}
.inc .li .ref{width:auto}

/* Media */
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.mcard{border:1px solid var(--line);background:var(--raise);border-radius:10px;overflow:hidden;display:grid}
.mcard .img{aspect-ratio:4/3;background:var(--bg) center/cover no-repeat;position:relative}
.mcard .img .cover{position:absolute;left:8px;top:8px;font:10.5px "Geist Mono",monospace;background:var(--accent);color:var(--accent-fg);border-radius:5px;padding:1px 6px}
.mcard .f{padding:10px;display:grid;gap:6px}
.mcard .f input,.mcard .f textarea{width:100%;border:1px solid var(--line);background:var(--field);border-radius:7px;padding:5px 8px;font-size:13px;outline:none}
.mcard .f textarea{resize:vertical;min-height:52px}
.mcard .bar{display:flex;gap:2px;padding:0 8px 8px;justify-content:flex-end}
.drop{border:1.5px dashed var(--line);border-radius:10px;display:grid;place-items:center;text-align:center;gap:6px;padding:18px;color:var(--muted);font-size:13.5px;cursor:pointer;min-height:120px}
.drop:hover,.drop.over{border-color:var(--accent-ink);color:var(--fg)}
.drop input{display:none}
.mrow{display:grid;grid-template-columns:24px minmax(0,1fr) auto;gap:10px;align-items:start;border:1px solid var(--line);background:var(--raise);border-radius:9px;padding:10px}
.mrow .fs{display:grid;gap:6px}
.mrow .fs .r{display:grid;gap:6px;grid-template-columns:repeat(2,minmax(0,1fr))}
.mrow input{width:100%;border:1px solid var(--line);background:var(--field);border-radius:7px;padding:5px 8px;font-size:13px;outline:none}
.mrow audio,.mrow video{width:100%;max-height:220px;border-radius:7px}
.mrow .fn{font:12px "Geist Mono",monospace;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mh{display:flex;align-items:center;gap:8px;font-weight:500;font-size:14px;margin-top:4px}
.mh small{font:11.5px "Geist Mono",monospace;color:var(--muted);font-weight:400}
.up{font:12px "Geist Mono",monospace;color:var(--muted)}

/* Side panel */
.check{display:grid;gap:6px;font-size:13.5px}
.check div{display:flex;gap:8px;align-items:center}
.check .ok{color:var(--muted)}
.check .ok .ico{color:var(--accent-ink)}
.check .no .ico{color:var(--muted)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:13px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;font-family:"Geist Mono",monospace;font-size:12px;text-align:right;overflow:hidden;text-overflow:ellipsis}
.private{border-left:3px solid var(--fg)}
.savebar{position:sticky;bottom:0;z-index:6;display:flex;align-items:center;gap:10px;padding:12px 28px;border-top:1px solid var(--line);background:color-mix(in srgb,var(--surface) 94%,transparent);backdrop-filter:blur(10px);margin-top:12px}
.savebar .msg{flex:1;font-size:14px;color:var(--muted);min-width:0}
.savebar .msg b{color:var(--fg);font-weight:500}

/* Dialog and toast */
dialog{border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:14px;padding:0;width:min(560px,calc(100vw - 32px));box-shadow:0 30px 80px -20px rgba(0,0,0,.5)}
dialog::backdrop{background:rgba(0,0,0,.45)}
.dlg{padding:24px;display:grid;gap:14px}
.dlg h2{margin:0;font-size:20px;font-weight:600}
.dlg p{margin:0;color:var(--muted)}
.dlg .acts{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.dlg .chg{max-height:240px;overflow:auto;border:1px solid var(--line);border-radius:9px;padding:4px 12px;background:var(--bg)}
.steps{display:grid;gap:8px;font-size:14px}
.steps div{display:flex;gap:10px;align-items:center;color:var(--muted)}
.steps div.on{color:var(--fg)}
.steps div.done{color:var(--fg)}
.steps .dot{width:16px;height:16px;border-radius:50%;border:1.5px solid var(--line);flex:none;display:grid;place-items:center}
.steps .on .dot{border-color:var(--accent-ink);border-top-color:transparent;animation:spin .9s linear infinite}
.steps .done .dot{background:var(--accent);border-color:var(--accent)}
.steps .done .dot:after{content:'';width:6px;height:3px;border-left:1.5px solid var(--accent-fg);border-bottom:1.5px solid var(--accent-fg);transform:rotate(-45deg) translate(1px,-1px)}
@keyframes spin{to{transform:rotate(360deg)}}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:50;background:var(--fg);color:var(--bg);border-radius:9px;padding:10px 16px;font-size:14px;box-shadow:0 10px 30px -10px rgba(0,0,0,.4);max-width:calc(100vw - 32px)}
.toast.bad{background:var(--bad);color:#fff}
.loading{color:var(--muted);padding:40px 0}
/* Story and Home page editors */
.seg.sm button{padding:3px 10px;font-size:12.5px}
.fld textarea.ms{min-height:520px}
.prev{border:1px solid var(--line);background:var(--field);border-radius:8px;padding:6px 22px;font-family:Newsreader,Georgia,serif;font-size:17px;line-height:1.65;overflow:auto}
.prev h1,.prev h2,.prev h3{font-family:Geist,system-ui,sans-serif;font-weight:600;letter-spacing:-.01em}
.prev blockquote{margin:1em 0;padding-left:16px;border-left:2px solid var(--line);color:var(--muted)}
.prev .spk{margin-top:1.6em}
.prev table{border-collapse:collapse;font-size:14px;font-family:Geist,system-ui,sans-serif}.prev td,.prev th{border:1px solid var(--line);padding:4px 8px}
.hitem{border:1px solid var(--line);background:var(--raise);border-radius:10px;padding:12px 14px;display:grid;gap:12px}
.hitem .hh{display:flex;align-items:center;gap:10px;font-size:14px}
.hitem .hh b{font-weight:500;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
input.mono{font-family:"Geist Mono",ui-monospace,monospace;font-size:13px}
/* History and media library */
dialog:has(.dlg.wide){width:min(860px,calc(100vw - 32px))}
.diffs{display:grid;gap:14px;max-height:56vh;overflow:auto;border:1px solid var(--line);border-radius:9px;padding:14px;background:var(--bg)}
.dif b{display:block;font:500 11px "Geist Mono",monospace;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.dtx{font-size:14.5px;line-height:1.6;overflow-wrap:anywhere}
.dtx p{margin:0 0 8px}
.dtx .dsame{font:12px "Geist Mono",monospace;color:var(--muted)}
del{text-decoration:line-through;text-decoration-thickness:1.5px;color:var(--muted)}
ins{text-decoration:none;background:color-mix(in srgb,var(--accent) 55%,transparent);color:var(--fg);border-radius:2px}
.pick{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;max-height:56vh;overflow:auto}

@media(max-width:1100px){.edgrid{grid-template-columns:minmax(0,1fr)}.edside{position:static;order:-1;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:860px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{display:none}
  .mnav{display:flex;gap:4px;overflow-x:auto;padding:8px 16px;border-bottom:1px solid var(--line);background:var(--surface);scrollbar-width:none}
  .mnav a{padding:6px 10px;border-radius:7px;font-size:14px;color:var(--muted);white-space:nowrap}
  .mnav a.on{color:var(--fg);background:var(--raise)}
  .top{padding:10px 16px}
  .top .acts .btn.ghost .lb{display:none}
  .view{padding:20px 16px}
  .savebar{padding:10px 16px}
  .g2,.r2,.r3{grid-template-columns:minmax(0,1fr)}
  .oi .row,.oi .row.two{grid-template-columns:minmax(0,1fr)}
  .tbl .hide-s{display:none}
  .li .ref{width:96px}
}
@media(max-width:520px){.g4{grid-template-columns:minmax(0,1fr)}.mrow .fs .r{grid-template-columns:minmax(0,1fr)}}

<body>
<div id="root"><p class="loading" style="text-align:center">Loading</p></div>
<dialog id="dlg"></dialog>

<script src="supabase.js"></script>
<script src="marked.js"></script>
<script>
'use strict';
// Public, read-only values. The database's own rules decide who may write.
const SB_URL = 'https://qldxlphmvjjovzlmeguw.supabase.co';
const SB_KEY = 'sb_publishable_U4rHZlnmKnyPzdufaovQ9w_odaCFZbP';
const sb = supabase.createClient(SB_URL, SB_KEY, {
  auth: { flowType: 'implicit', persistSession: true, autoRefreshToken: true, detectSessionInUrl: true },
});

// ---------- helpers ----------
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const I = {
  dash: '<path d="M3 3h7v9H3zM14 3h7v5h-7zM14 12h7v9h-7zM3 16h7v5H3z"/>',
  list: '<path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/>',
  book: '<path d="M4 4.5A2.5 2.5 0 0 1 6.5 2H20v17H6.5A2.5 2.5 0 0 0 4 21.5zM4 21.5A2.5 2.5 0 0 1 6.5 19H20v3H6.5"/>',
  home: '<path d="M3 11l9-8 9 8M5 9.5V21h14V9.5"/>',
  image: '<rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="M21 15l-5-5L5 21"/>',
  clock: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
  ext: '<path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/>',
  out: '<path d="M15 4h4a1 1 0 0 1 1 1v14a1 1 0 0 1-1 1h-4M10 17l5-5-5-5M15 12H3"/>',
  plus: '<path d="M12 5v14M5 12h14"/>',
  up: '<path d="M12 19V5M6 11l6-6 6 6"/>',
  down: '<path d="M12 5v14M6 13l6 6 6-6"/>',
  x: '<path d="M6 6l12 12M18 6L6 18"/>',
  check: '<path d="M5 12.5l4.5 4.5L19 7"/>',
  circle: '<circle cx="12" cy="12" r="8"/>',
  upload: '<path d="M12 16V4M7 9l5-5 5 5M4 16v3a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3"/>',
  search: '<circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/>',
  chev: '<path d="M9 6l6 6-6 6"/>',
  send: '<path d="M4 12l16-8-6 16-2.5-6.5z"/>',
  back: '<path d="M15 6l-6 6 6 6"/>',
  lock: '<rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/>',
  file: '<path d="M14 3H6a1 1 0 0 0-1 1v16a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V8zM14 3v5h5"/>',
};
const ico = (n) => `<svg class="ico" viewBox="0 0 24 24" aria-hidden="true">${I[n]}</svg>`;
const fmtDate = (d) => d ? new Date(d).toLocaleString('en-GB', { day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' }) : '';
const fmtDay = (d) => d ? new Date(d).toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' }) : '';
const ago = (d) => {
  const s = (Date.now() - new Date(d)) / 1000;
  if (s < 60) return 'just now';
  if (s < 3600) return Math.round(s / 60) + ' min ago';
  if (s < 86400) return Math.round(s / 3600) + ' h ago';
  return fmtDay(d);
};
function toast(msg, bad) {
  const t = document.createElement('div');
  t.className = 'toast' + (bad ? ' bad' : '');
  t.textContent = msg;
  document.body.append(t);
  setTimeout(() => t.remove(), bad ? 7000 : 3200);
}
const fileUrl = (bucket, file) => /^https?:\/\//.test(file) ? file : sb.storage.from(bucket).getPublicUrl(file).data.publicUrl;

// The Codex house rules: no em dashes, no contractions.
function lint(v) {
  const out = [];
  if (/—/.test(v)) out.push('Em dash');
  const c = String(v).match(/\b[A-Za-z]+(?:n['’]t|['’](?:re|ve|ll|m|d))\b/g);
  if (c) out.push('Contraction: ' + [...new Set(c)].slice(0, 3).join(', '));
  return out;
}
const words = (v) => (String(v).trim().match(/\S+/g) || []).length;

// ---------- reference data ----------
const S = { cats: [], marks: [], rtypes: [], sections: [], groups: [], entries: [], releases: [], tunings: [], pfields: [], live: null, user: null };
const REQ = [['mark', 'Mark'], ['grade', 'Grade'], ['summary', 'Summary'], ['entry', 'Entry'], ['appears_in', 'Appears in'], ['reliability', 'Reliability']];
const missing = (e) => REQ.filter(([k]) => !String(e[k] ?? '').trim()).map(([, l]) => l);
const catLabel = (c) => (S.cats.find((x) => x.code === c) || {}).label || c;
const markLabel = (m, c) => (S.marks.find((x) => x.code === m && x.category === c) || {}).label || '';
const ICONS = ['pin', 'user', 'cube', 'waves', 'book', 'map', 'compass', 'route', 'shield', 'image', 'audio', 'play', 'file'];

async function loadBase() {
  const q = (t, sel, order) => sb.from(t).select(sel).order(order[0], { ascending: order[1] !== false });
  const r = await Promise.all([
    q('categories', '*', ['sort_order']),
    q('marks', '*', ['position']),
    q('relation_types', '*', ['position']),
    q('story_sections', 'slug,title,position,kind,label,group_code,updated_at', ['position']),
    q('story_groups', '*', ['position']),
    q('entries', '*', ['ref']),
    sb.from('releases').select('id,created_at,entries,note').order('id', { ascending: false }).limit(10),
    sb.from('site_content').select('key,updated_at'),
    q('tunings', '*', ['position']),
    // Private fields: only the owner can read these, so their names are
    // not in this page's code.
    q('private_fields', '*', ['position']),
  ]);
  const err = r.find((x) => x.error);
  if (err) throw err.error;
  [S.cats, S.marks, S.rtypes, S.sections, S.groups, S.entries, S.releases, S.content, S.tunings, S.pfields] = r.map((x) => x.data);
  S.live = await fetch('/release.json?' + Date.now(), { cache: 'no-store' }).then((x) => x.ok ? x.json() : null).catch(() => null);
}
const lastRelease = () => S.releases[0] || null;
// Everything edited since the last publish: entries, Story sections, copy.
const CONTENT_NAME = { home: ['Home', 'Home page copy', '#/home'], book: ['Story', 'Book title and cover copy', '#/book'] };
const changed = () => {
  const r = lastRelease();
  const after = (d) => !r || new Date(d) > new Date(r.created_at);
  return [
    ...S.entries.filter((e) => after(e.updated_at)).map((e) => ({ ref: e.ref.slice(8), name: e.name, at: e.updated_at, href: '#/e/' + e.slug })),
    ...S.sections.filter((x) => after(x.updated_at)).map((x) => ({ ref: 'Story', name: x.label || x.title, at: x.updated_at, href: '#/s/' + x.slug })),
    ...S.content.filter((c) => after(c.updated_at)).map((c) => ({ ref: CONTENT_NAME[c.key][0], name: CONTENT_NAME[c.key][1], at: c.updated_at, href: CONTENT_NAME[c.key][2] })),
    ...tuningChange(after),
  ].sort((a, b) => new Date(b.at) - new Date(a.at));
};
// A renamed Tuning option changes what the site shows.
const tuningChange = (after) => {
  const at = S.tunings.map((t) => t.updated_at).filter(after).sort().pop();
  return at ? [{ ref: 'Lists', name: 'Tuning options', at, href: '#/tunings' }] : [];
};
const changes = (n) => `${n} ${n === 1 ? 'change' : 'changes'}`;

// ---------- sign in ----------
function showSignIn(err) {
  $('#root').innerHTML = `<div class="auth"><div class="authcard">
    <p class="eyebrow">Syren Codex · Admin</p>
    <h1>Sign in</h1>
    <p>Enter your email address. A sign-in link will be sent to it.</p>
    ${err ? `<div class="note bad" style="margin-bottom:16px">${esc(err)}</div>` : ''}
    <form id="sf"><div class="fld"><label for="em">Email address</label><input id="em" type="email" autocomplete="email" required></div>
    <button class="btn pri" type="submit">${ico('send')}Send the link</button></form>
    <div id="sent" hidden></div></div></div>`;
  $('#sf').addEventListener('submit', async (ev) => {
    ev.preventDefault();
    const email = $('#em').value.trim();
    const b = $('#sf button');
    b.disabled = true;
    const { error } = await sb.auth.signInWithOtp({ email, options: { shouldCreateUser: false, emailRedirectTo: location.origin + '/admin/' } });
    b.disabled = false;
    if (error) {
      const m = /signup|not allowed|not found/i.test(error.message) ? 'This address cannot sign in to the admin.'
        : /rate|seconds|too many/i.test(error.message) ? 'Too many links were sent. Wait a few minutes, then try again.'
        : error.message;
      toast(m, true);
      return;
    }
    $('#sf').hidden = true;
    $('#sent').hidden = false;
    $('#sent').innerHTML = `<div class="note">The link is on its way to <b>${esc(email)}</b>. Open the email on this device and select <b>Sign in</b>. The link works once, and only for a short time.</div>
      <p style="margin:16px 0 0;font-size:14px"><a href="#" id="again" style="text-decoration:underline">Use a different address</a></p>`;
    $('#again').onclick = (e) => { e.preventDefault(); showSignIn(); };
  });
}
function showNoAccess(email) {
  $('#root').innerHTML = `<div class="auth"><div class="authcard"><p class="eyebrow">Syren Codex · Admin</p><h1>No access</h1>
    <p>${esc(email)} is signed in, but this account cannot edit the archive.</p><button class="btn" id="so">${ico('out')}Sign out</button></div></div>`;
  $('#so').onclick = () => sb.auth.signOut();
}

// ---------- shell ----------
const NAV = [
  ['#/', 'dash', 'Dashboard'],
  ['#/entries', 'list', 'Entries'],
  ['#/story', 'book', 'Story'],
  ['#/home', 'home', 'Home page'],
  ['#/media', 'image', 'Media library'],
  ['#/tunings', 'list', 'Tuning options'],
  ['#/history', 'clock', 'History'],
];
function shell() {
  $('#root').innerHTML = `<div class="app">
    <aside class="side">
      <a class="brand" href="#/"><img src="/brand/syren-icon-dark.svg" alt=""><span>Syren Codex<small>Admin</small></span></a>
      <nav class="nav" id="nav">${NAV.map(([h, i, l]) => `<a href="${h}">${ico(i)}${l}</a>`).join('')}</nav>
      <div class="sidefoot"><span class="who" title="${esc(S.user.email)}">${esc(S.user.email)}</span>
        <div class="row"><a class="btn sm" href="/" target="_blank" rel="noopener">${ico('ext')}Live site</a><button class="btn sm ghost" id="so">${ico('out')}Sign out</button></div></div>
    </aside>
    <div class="main">
      <header class="top"><div class="crumbs" id="crumbs"></div>
        <div class="acts"><button class="btn pri" id="pubb">${ico('upload')}<span>Publish</span><span class="badge" id="pubn" hidden></span></button></div></header>
      <nav class="mnav" id="mnav">${NAV.map(([h, , l]) => `<a href="${h}">${l}</a>`).join('')}<a href="/" target="_blank" rel="noopener">Live site</a><a href="#" id="so2">Sign out</a></nav>
      <div id="view"></div>
    </div></div>`;
  $('#so').onclick = () => sb.auth.signOut();
  $('#so2').onclick = (e) => { e.preventDefault(); sb.auth.signOut(); };
  $('#pubb').onclick = () => openPublish();
  paintPublish();
}
function paintPublish() {
  const n = changed().length, b = $('#pubn');
  if (!b) return;
  b.hidden = !n;
  b.textContent = n;
  $('#pubb').title = n ? `${changes(n)} not yet published` : 'Everything is published';
}
function setNav(h) {
  $$('#nav a[href], #mnav a[href^="#/"]').forEach((a) => a.classList.toggle('on', a.getAttribute('href') === h));
}
function crumbs(parts) {
  $('#crumbs').innerHTML = parts.map((p, i) => i === parts.length - 1 ? `<b>${esc(p[0])}</b>` : `<a href="${p[1]}">${esc(p[0])}</a><span>/</span>`).join('');
}

// ---------- router ----------
let leaveGuard = null;
let lastHash = location.hash;
function route() {
  if (leaveGuard && !leaveGuard()) { history.replaceState(null, '', lastHash || '#/'); return; }
  leaveGuard = null;
  lastHash = location.hash;
  const [path, qs] = (location.hash.slice(1) || '/').split('?');
  const p = new URLSearchParams(qs || '');
  const seg = path.split('/').filter(Boolean);
  window.scrollTo(0, 0);
  if (!seg.length) return viewDash();
  if (seg[0] === 'entries') return viewList(p);
  if (seg[0] === 'e' && seg[1]) return viewEntry(seg[1]);
  if (seg[0] === 'new' && seg[1]) return viewEntry(null, seg[1].toUpperCase());
  if (seg[0] === 'story') return viewStory();
  if (seg[0] === 's' && seg[1]) return viewSection(seg[1]);
  if (seg[0] === 'book') return viewBook();
  if (seg[0] === 'home') return viewHome();
  if (seg[0] === 'media') return viewMedia(p);
  if (seg[0] === 'tunings') return viewTunings();
  if (seg[0] === 'history') return viewHistory();
  location.hash = '#/';
}

// ---------- dashboard ----------
function viewDash() {
  setNav('#/');
  crumbs([['Dashboard']]);
  const E = S.entries, rel = lastRelease(), ch = changed();
  const needs = E.filter((e) => missing(e).length);
  const recent = [
    ...E.map((e) => ({ ref: e.ref.slice(8), name: e.name, at: e.updated_at, href: '#/e/' + e.slug })),
    ...S.sections.map((x) => ({ ref: 'Story', name: x.label || x.title, at: x.updated_at, href: '#/s/' + x.slug })),
    ...S.content.map((c) => ({ ref: CONTENT_NAME[c.key][0], name: CONTENT_NAME[c.key][1], at: c.updated_at, href: CONTENT_NAME[c.key][2] })),
  ].sort((a, b) => new Date(b.at) - new Date(a.at)).slice(0, 8);
  const live = S.live && S.live.id;
  const stat = (c) => {
    const xs = E.filter((e) => e.type === c.code), n = xs.length || 1;
    const k = (s) => xs.filter((e) => e.status === s).length;
    return `<a class="card stat" href="#/entries?cat=${c.code}"><h3>${esc(c.label)}</h3><b>${xs.length}</b>
      <div class="bar"><i class="f" style="width:${k('Verified') / n * 100}%"></i><i style="width:${k('Filed') / n * 100}%"></i></div>
      <div class="leg"><span>${k('Draft')} draft</span><span>${k('Filed')} filed</span><span>${k('Verified')} verified</span></div></a>`;
  };
  $('#view').innerHTML = `<div class="view">
    <h1 class="pt">Dashboard</h1><p class="lede">The archive at a glance. Edits stay here until you publish them.</p>
    <div class="card" style="margin-bottom:16px"><div class="pub">
      <div class="txt"><b>${ch.length ? `${changes(ch.length)} since the last publish` : 'Everything is published'}</b>
      <p>${rel ? `Last published ${fmtDate(rel.created_at)}${live ? (live === rel.id ? '. The live site shows it.' : '. The live site is still updating.') : '.'}` : 'Nothing has been published from the admin yet.'}</p></div>
      <button class="btn pri" id="pub2">${ico('upload')}Publish${ch.length ? ` <span class="badge">${ch.length}</span>` : ''}</button></div></div>
    <div class="grid g4" style="margin-bottom:16px">${S.cats.map(stat).join('')}</div>
    <div class="grid g2">
      <div class="card"><h3>Needs work<span class="r">${needs.length} missing fields · <a href="#/entries?need=1" style="text-decoration:underline">all</a></span></h3>
        <div class="list">${needs.length ? needs.map((e) => `<a class="li" href="#/e/${e.slug}"><span class="ref">${esc(e.ref.slice(8))}</span><span class="nm">${esc(e.name)}</span><span class="miss">${missing(e).map((m) => `<span class="tag warn">${m}</span>`).join('')}</span></a>`).join('') : '<p class="empty">Every entry has its required fields.</p>'}</div>
        <p class="empty" style="margin-top:8px">${E.filter((e) => e.status === 'Draft').length} of ${E.length} entries are Draft. <a href="#/entries?status=Draft" style="text-decoration:underline">See them</a></p></div>
      <div class="card"><h3>Recently edited</h3><div class="list">${recent.map((x) => `<a class="li" href="${x.href}"><span class="ref">${esc(x.ref)}</span><span class="nm">${esc(x.name)}</span><span class="meta">${ago(x.at)}</span></a>`).join('')}</div></div>
    </div></div>`;
  $('#pub2').onclick = () => openPublish();
}

// ---------- entries list ----------
function viewList(p) {
  setNav('#/entries');
  crumbs([['Entries']]);
  const st = { cat: p.get('cat') || '', status: p.get('status') || '', need: p.get('need') === '1', q: p.get('q') || '' };
  const cnt = (c) => S.entries.filter((e) => !c || e.type === c).length;
  $('#view').innerHTML = `<div class="view">
    <div style="display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap;margin-bottom:20px"><div style="flex:1"><h1 class="pt">Entries</h1><p class="lede" style="margin:0">Every Codex entry. Select one to edit it.</p></div>
      <div style="display:flex;gap:8px;align-items:center"><select class="inp" id="newc" style="width:auto">${S.cats.map((c) => `<option value="${c.code}">${esc(c.label)}</option>`).join('')}</select><button class="btn" id="newb">${ico('plus')}New entry</button></div></div>
    <div class="tools">
      <div class="seg" id="cats"><button data-c="">All <small>${cnt('')}</small></button>${S.cats.map((c) => `<button data-c="${c.code}">${esc(c.label)} <small>${cnt(c.code)}</small></button>`).join('')}</div>
      <div class="seg" id="sts">${['', 'Draft', 'Filed', 'Verified'].map((s) => `<button data-s="${s}">${s || 'Any status'}</button>`).join('')}</div>
      <label class="chk"><input type="checkbox" id="need"> Needs work</label>
      <label class="search">${ico('search')}<input id="q" placeholder="Search names, references, text" autocomplete="off"></label>
    </div>
    <p class="count" id="count"></p>
    <div class="tblwrap"><table class="tbl"><thead><tr><th>Reference</th><th>Name</th><th class="hide-s">Mark</th><th>Grade</th><th>Status</th><th class="hide-s">Updated</th></tr></thead><tbody id="rows"></tbody></table></div></div>`;
  $('#q').value = st.q;
  $('#need').checked = st.need;
  const paint = () => {
    $$('#cats button').forEach((b) => b.classList.toggle('on', b.dataset.c === st.cat));
    $$('#sts button').forEach((b) => b.classList.toggle('on', b.dataset.s === st.status));
    const q = st.q.toLowerCase();
    const xs = S.entries.filter((e) => (!st.cat || e.type === st.cat) && (!st.status || e.status === st.status)
      && (!st.need || e.status === 'Draft' || missing(e).length)
      && (!q || [e.ref, e.name, e.aliases, e.summary, e.entry].some((v) => String(v || '').toLowerCase().includes(q))));
    $('#count').textContent = `${xs.length} ${xs.length === 1 ? 'entry' : 'entries'}`;
    $('#rows').innerHTML = xs.map((e) => `<tr class="row" data-s="${e.slug}">
      <td class="ref">${esc(e.ref)}</td>
      <td><span class="nm">${esc(e.name)}</span>${e.published ? '' : ' <span class="tag">Hidden</span>'}<span class="sm">${esc(e.summary)}</span></td>
      <td class="mk hide-s">${esc(markLabel(e.mark, e.type) || '')}</td>
      <td>${e.grade ? `<span class="gr ${e.grade}">${e.grade}</span>` : '<span class="gr none" title="Not graded"></span>'}</td>
      <td><span class="st ${e.status}">${e.status}</span>${missing(e).length ? `<span class="tag warn" style="margin-left:6px" title="Missing: ${missing(e).join(', ')}">${missing(e).length} missing</span>` : ''}</td>
      <td class="up hide-s">${fmtDay(e.updated_at)}</td></tr>`).join('') || `<tr><td colspan="6" class="empty" style="padding:20px">No entries match.</td></tr>`;
    const qs = new URLSearchParams(Object.entries({ cat: st.cat, status: st.status, need: st.need ? '1' : '', q: st.q }).filter(([, v]) => v));
    const h = '#/entries' + (qs.toString() ? '?' + qs : '');
    history.replaceState(null, '', h);
    lastHash = h;
  };
  $('#cats').onclick = (e) => { const b = e.target.closest('button'); if (b) { st.cat = b.dataset.c; paint(); } };
  $('#sts').onclick = (e) => { const b = e.target.closest('button'); if (b) { st.status = b.dataset.s; paint(); } };
  $('#need').onchange = (e) => { st.need = e.target.checked; paint(); };
  $('#q').oninput = (e) => { st.q = e.target.value; paint(); };
  $('#rows').onclick = (e) => { const r = e.target.closest('tr.row'); if (r) location.hash = '#/e/' + r.dataset.s; };
  $('#newc').value = st.cat || 'LOC';
  $('#newb').onclick = () => { location.hash = '#/new/' + $('#newc').value; };
  paint();
}

function sectionOptions(sel, blank = 'Not recorded') {
  return `<option value="">${blank}</option>` + S.groups.map((g) => `<optgroup label="${esc(g.name)}">${S.sections.filter((s) => s.group_code === g.code)
    .map((s) => `<option value="${s.slug}"${s.slug === sel ? ' selected' : ''} title="${esc(s.title)}">${esc(s.label || s.title)}</option>`).join('')}</optgroup>`).join('');
}
function entryOptions(sel, except) {
  return `<option value="">Choose an entry</option>` + S.cats.map((c) => `<optgroup label="${esc(c.label)}">${S.entries.filter((e) => e.type === c.code && e.ref !== except)
    .map((e) => `<option value="${e.ref}"${e.ref === sel ? ' selected' : ''}>${esc(e.ref.slice(8))}  ${esc(e.name)}</option>`).join('')}</optgroup>`).join('');
}

async function viewEntry(slug, newType) {
  setNav('#/entries');
  $('#view').innerHTML = '<div class="view loading">Loading the entry</div>';
  let e;
  if (slug) {
    e = S.entries.find((x) => x.slug === slug);
    if (!e) { $('#view').innerHTML = '<div class="view"><p class="empty">There is no entry at this address.</p></div>'; return; }
    const { data: fresh, error } = await sb.from('entries').select('*').eq('ref', e.ref).single();
    if (error) return toast(error.message, true);
    Object.assign(e, fresh);
  } else {
    if (!FACT_TABLE[newType]) { location.hash = '#/entries'; return; }
    e = { ref: null, type: newType, slug: null, name: '', aliases: '', mark: '', grade: '', source_count: null, summary: '', entry: '', appears_in: '', reliability: '', cross_references_note: '', archivist_note: '', status: 'Draft', published: true, featured_order: null, icon: '', lottie: '' };
  }
  const ref = e.ref;
  const one = (t, col, order = 'position') => sb.from(t).select('*').eq(col, ref).order(order);
  const [facts, apps, rout, rin, img, aud, vid, fil, note, priv] = ref ? await Promise.all([
    sb.from(FACT_TABLE[e.type]).select('*').eq('ref', ref).maybeSingle(),
    one('entry_appearances', 'entry_ref'),
    one('relations', 'from_ref'),
    one('relations', 'to_ref'),
    one('entry_images', 'entry_ref'), one('entry_audio', 'entry_ref'), one('entry_video', 'entry_ref'), one('entry_files_view', 'entry_ref'),
    sb.from('editor_notes').select('note').eq('ref', ref).maybeSingle(),
    sb.from('private_values').select('field,value').eq('ref', ref),
  ]) : Array(10).fill({ data: null });
  const bad = [facts, apps, rout, rin, img, aud, vid, fil, note, priv].find((x) => x.error);
  if (bad) return toast(bad.error.message, true);
  M = {
    ref, type: e.type, slug: e.slug, updated_at: e.updated_at,
    entry: { ...e },
    facts: facts.data || {},
    appearances: (apps.data || []).map((a) => a.section),
    relations: (rout.data || []).map((r) => ({ type: r.type, to_ref: r.to_ref, note: r.note || '' })),
    incoming: rin.data || [],
    images: img.data || [], audio: aud.data || [], video: vid.data || [], files: fil.data || [],
    editor_note: (note.data && note.data.note) || '',
    private: Object.fromEntries((priv.data || []).map((x) => [x.field, x.value])),
    dirty: false,
  };
  crumbs([['Entries', '#/entries'], [ref ? `${ref.slice(8)} ${e.name}` : `New ${catLabel(e.type).replace(/s$/, '').toLowerCase()}`]]);
  renderEditor();
  if (M.ref) histCard({ kind: 'entry', key: M.ref, compare: entryCompare, apply: entryApply });
  leaveGuard = () => !M || !M.dirty || confirm('You have unsaved changes on this entry. Leave without saving?');
}

function fld(k, label, val, kind = 'text', o = {}) {
  const id = 'f_' + k.replace('.', '_');
  const req = o.req ? '<span class="req">Required to file</span>' : '';
  let input;
  if (kind === 'area' || kind === 'long') input = `<textarea id="${id}" data-f="${k}" class="${kind === 'long' ? 'long' : ''}" rows="${o.rows || 3}">${esc(val)}</textarea>`;
  else if (kind === 'select') input = `<select id="${id}" data-f="${k}">${o.blank !== false ? `<option value="">${o.blankLabel || 'Not recorded'}</option>` : ''}${o.opts.map((x) => { const [v, l] = Array.isArray(x) ? x : [x, x]; return `<option value="${esc(v)}"${String(v) === String(val ?? '') ? ' selected' : ''}>${esc(l)}</option>`; }).join('')}</select>`;
  else if (kind === 'section') input = `<select id="${id}" data-f="${k}">${sectionOptions(val)}</select>`;
  else if (kind === 'bool') return `<label class="chk"><input type="checkbox" id="${id}" data-f="${k}"${val ? ' checked' : ''}> ${esc(label)}</label>`;
  else input = `<input id="${id}" type="${kind === 'number' ? 'number' : 'text'}"${kind === 'number' ? ' step="any"' : ''} data-f="${k}" value="${esc(val ?? '')}"${o.ph ? ` placeholder="${esc(o.ph)}"` : ''}>`;
  const counter = o.words ? `<span class="cnt" data-cnt="${k}" data-max="${o.words}"></span>` : '';
  return `<div class="fld"><label for="${id}">${esc(label)} ${req}${counter}</label>${input}${o.help ? `<span class="help">${esc(o.help)}</span>` : ''}${o.lint ? `<div class="lint" data-lint="${k}"></div>` : ''}</div>`;
}

      <h1 id="hname">${esc(e.name || 'Untitled entry')}</h1></div>
      ${isNew ? '' : `<a class="btn" href="/#e-${esc(M.slug)}" target="_blank" rel="noopener">${ico('ext')}View live page</a>`}
    </div>

          ${fld('entry.icon', 'Icon', e.icon, 'select', { opts: ICONS, blankLabel: 'None' })}
          ${fld('entry.featured_order', 'Featured order', e.featured_order, 'number', { help: 'A number puts it in the featured list. Empty means not featured.' })}</div>`)}
      ${section('02', 'Text', `
        ${fld('entry.summary', 'Summary', e.summary, 'area', { req: true, rows: 2, words: 30, lint: true, help: 'One sentence, 30 words at most. Used on cards and in search.' })}
        ${fld('entry.entry', 'Entry', e.entry, 'long', { req: true, rows: 14, lint: true, help: 'Plain prose in archive voice: uncontracted, no em dashes, only facts the sources support. Leave a blank line between paragraphs.' })}`)}
      ${section('03', 'Evidence', `
        <div class="r2"><div class="fld"><span class="lbl">Grade <span class="req">Required to file</span></span><div class="seg" id="grade">${[['', 'None'], ['C', 'C confirmed'], ['E', 'E estimated'], ['U', 'U unconfirmed']].map(([v, l]) => `<button type="button" data-v="${v}">${l}</button>`).join('')}</div></div>
          ${fld('entry.source_count', 'Source count', e.source_count, 'number', { help: 'Independent manuscript passages behind the grade.' })}</div>
        ${fld('entry.reliability', 'Reliability', e.reliability, 'area', { req: true, rows: 3, lint: true, help: 'One line explaining the grade, including anything in the project brief only.' })}`)}
      ${section('04', 'Key facts', `<p class="help nr" style="margin:0">An empty fact shows on the site as Not recorded. It is never guessed.</p><div class="r2">${factFields.join('')}</div>${privFields.length ? `<div class="r2" style="margin-top:14px">${privFields.join('')}</div>` : ''}`, { hint: catLabel(t) })}
      ${section('05', 'Appears in', `
        ${fld('entry.appears_in', 'Appears in, as text', e.appears_in, 'area', { req: true, rows: 3, lint: true, help: 'The note shown under Appears in.' })}
        <div class="fld"><span class="lbl">Story sections, in order <span class="help">Each one links into the Story view.</span></span><div class="ol" id="apps"></div>
          <div class="addrow"><select class="inp" id="appadd">${sectionOptions('', 'Add a section')}</select></div></div>`, { hint: '<span id="appn"></span>' })}

          const o = S.entries.find((x) => x.ref === r.from_ref) || { name: r.from_ref, slug: '' };
          const rt = S.rtypes.find((x) => x.code === r.type) || { inverse_label: r.type };
          return `<a class="li" href="#/e/${o.slug}"><span class="ref">${esc(rt.inverse_label)}</span><span class="nm">${esc(o.name)}</span><span class="meta">${esc(r.from_ref.slice(8))}</span></a>`;
        }).join('')}</div><span class="help">Edit these on the other entry.</span>` : '<p class="empty">None.</p>'}</div>`, { hint: '<span id="reln"></span>' })}
      ${section('07', 'Media', isNew ? '<p class="empty">Save the entry first, then add media.</p>' : Object.keys(MEDIA).map((k) => `<div><div class="mh">${MEDIA[k].label} <small id="mn_${k}"></small></div><p class="help" style="margin:2px 0 10px;font-size:12.5px;color:var(--muted)">${MEDIA[k].help}</p><div id="m_${k}"></div><div class="addrow" style="margin-top:8px"><button class="btn sm" type="button" data-lib="${k}">${ico('image')}Choose from the library</button></div></div>`).join('')
        + (isNew ? '' : `<div class="r2">${fld('entry.lottie', 'Lottie animation', e.lottie, 'text', { help: 'Optional. A file in the lottie bucket, used as the icon or header.' })}<div class="fld"><span class="lbl">Upload an animation</span><label class="drop" style="min-height:0;padding:10px">${ico('upload')} JSON or zip<input type="file" accept="application/json,application/zip,.json,.lottie" id="lotup"></label></div></div>`), { hint: '<span id="medn"></span>' })}
      ${section('08', 'Notes', `
        ${fld('entry.cross_references_note', 'Cross-references note', e.cross_references_note, 'area', { lint: true })}
        ${fld('entry.archivist_note', 'Archivist note', e.archivist_note, 'area', { lint: true, help: 'Shown on the site. Anything the reader should know that the sources do not say.' })}

    </div>
    <aside class="edside">
      <div class="card"><h3>Status</h3>
        <div class="seg" id="status" style="width:100%">${['Draft', 'Filed', 'Verified'].map((s) => `<button type="button" data-v="${s}" style="flex:1;justify-content:center">${s}</button>`).join('')}</div>
        <p class="help" id="sthelp" style="font-size:12.5px;color:var(--muted);margin:10px 0 0"></p>
        <div style="margin-top:12px">${fld('entry.published', 'Show on the site', e.published, 'bool')}</div></div>
      <div class="card"><h3>Ready to file</h3><div class="check" id="check"></div></div>
      <div class="card"><h3>Record</h3><dl class="kv">
        <dt>Reference</dt><dd>${esc(M.ref || 'On save')}</dd><dt>Address</dt><dd>${M.slug ? '/#e-' + esc(M.slug) : 'On save'}</dd>
        <dt>Last saved</dt><dd>${M.updated_at ? fmtDate(M.updated_at) : 'Never'}</dd>
        <dt>Published</dt><dd>${M.ref && lastRelease() ? (new Date(M.updated_at) > new Date(lastRelease().created_at) ? 'Has unpublished edits' : 'Up to date') : 'Not yet'}</dd></dl></div>
      ${isNew ? '' : '<div class="card"><h3>History</h3><div id="hist"><p class="empty">Loading</p></div></div>'}
    </aside></div></div>
    <div class="savebar"><div class="msg" id="smsg">No unsaved changes.</div>
      <button class="btn ghost" id="disc" hidden>Discard</button><button class="btn pri" id="save">${ico('check')}${isNew ? 'Create entry' : 'Save'}</button></div>`;

  // Grade and status segments.
  const seg = (id, key) => {
    const paint = () => $$('#' + id + ' button').forEach((b) => b.classList.toggle('on', (M.entry[key] || '') === b.dataset.v));
    $('#' + id).onclick = (ev) => {
      const b = ev.target.closest('button');
      if (!b || b.disabled) return;
      M.entry[key] = b.dataset.v;
      paint(); dirty();
    };
    paint();
  };
  seg('grade', 'grade');
  seg('status', 'status');

  // Fields.
  $('#view').oninput = $('#view').onchange = (ev) => {
    const el = ev.target.closest('[data-f]');
    if (el) { readField(el); dirty(); }
  };
  $('#appadd').onchange = (ev) => {
    const v = ev.target.value;
    if (v && !M.appearances.includes(v)) { M.appearances.push(v); paintApps(); dirty(); }

  };
  $('#reladd').onclick = () => { M.relations.push({ type: 'appears_with', to_ref: '', note: '' }); paintRels(); dirty(); };
  if ($('#lotup')) $('#lotup').onchange = async (ev) => {
    const f = ev.target.files[0];
    if (!f) return;
    try { const p = await upload('lottie', f); M.entry.lottie = p; $('#f_entry_lottie').value = p; dirty(); toast('Animation uploaded. Save to keep it.'); }
    catch (err) { toast(err.message, true); }
  };
  $('#save').onclick = save;
  $('#disc').onclick = () => { if (confirm('Discard your unsaved changes?')) { M.dirty = false; route(); } };
  paintApps(); paintRels(); paintMedia(); paintChecks();
  $$('[data-lib]').forEach((b) => { b.onclick = () => pickFromLibrary(b.dataset.lib); });
  $$('[data-lint],[data-cnt]').forEach((x) => paintLint(x.dataset.lint || x.dataset.cnt));
}

function readField(el) {
  const [grp, k] = el.dataset.f.includes('.') ? el.dataset.f.split('.') : [null, el.dataset.f];
  const v = el.type === 'checkbox' ? el.checked : el.value;
  if (grp) M[grp][k] = v; else M[k] = v;
  if (el.dataset.f === 'entry.name') $('#hname').textContent = v || 'Untitled entry';
  paintLint(el.dataset.f);
  paintChecks();
}
function paintLint(k) {
  const el = $(`[data-f="${k}"]`);
  if (!el) return;
  const l = $(`[data-lint="${k}"]`);
  if (l) l.innerHTML = lint(el.value).map((x) => `<span>${esc(x)}</span>`).join('');
  const c = $(`[data-cnt="${k}"]`);
  if (c) { const n = words(el.value), max = +c.dataset.max; c.textContent = `${n} of ${max} words`; c.classList.toggle('over', n > max); }
}
function paintChecks() {
  const miss = missing(M.entry);
  $('#check').innerHTML = REQ.map(([, l]) => `<div class="${miss.includes(l) ? 'no' : 'ok'}">${ico(miss.includes(l) ? 'circle' : 'check')}${l}</div>`).join('');
  $$('#status button').forEach((b) => { b.disabled = b.dataset.v !== 'Draft' && miss.length > 0; });
  $('#sthelp').textContent = miss.length ? `Filed and Verified need every required field. Missing: ${miss.join(', ')}.` : M.entry.status === 'Verified' ? 'Verified: checked by you against the sources.' : 'Only you set an entry to Verified.';
}
function dirty() {
  M.dirty = true;
  $('#smsg').innerHTML = '<b>Unsaved changes.</b> They stay here until you save.';
  $('#disc').hidden = M.ref === null;
}

function moveBtns(list, i, repaint) {
  return `<span class="mv"><button class="btn icon ghost" type="button" data-mv="${i},-1" title="Move up"${i === 0 ? ' disabled' : ''}>${ico('up')}</button><button class="btn icon ghost" type="button" data-mv="${i},1" title="Move down"${i === list.length - 1 ? ' disabled' : ''}>${ico('down')}</button><button class="btn icon ghost" type="button" data-rm="${i}" title="Remove">${ico('x')}</button></span>`;
}
function wireList(box, list, repaint) {
  box.onclick = (ev) => {
    const mv = ev.target.closest('[data-mv]'), rm = ev.target.closest('[data-rm]');
    if (mv) { const [i, d] = mv.dataset.mv.split(',').map(Number); [list[i], list[i + d]] = [list[i + d], list[i]]; repaint(); dirty(); }
    if (rm) { list.splice(+rm.dataset.rm, 1); repaint(); dirty(); }
  };
}
function paintApps() {
  const box = $('#apps'), L = M.appearances;
  box.innerHTML = L.map((s, i) => {
    const x = S.sections.find((y) => y.slug === s) || { title: s, label: s };
    return `<div class="oi"><span class="ix">${String(i + 1).padStart(2, '0')}</span><span><b style="font-weight:500">${esc(x.label || x.title)}</b> <span class="nr">${esc(x.title)}</span></span>${moveBtns(L, i)}</div>`;
  }).join('') || '<p class="empty">No sections yet.</p>';
  wireList(box, L, paintApps);
  $('#appn').textContent = L.length ? `${L.length} sections` : '';
}
function paintRels() {
  const box = $('#rels'), L = M.relations;
  box.innerHTML = L.map((r, i) => `<div class="oi"><span class="ix">${String(i + 1).padStart(2, '0')}</span><div class="row">
      <select data-ri="${i}" data-rk="type">${S.rtypes.map((t) => `<option value="${t.code}"${t.code === r.type ? ' selected' : ''}>${esc(t.label)}</option>`).join('')}</select>
      <select data-ri="${i}" data-rk="to_ref">${entryOptions(r.to_ref, M.ref)}</select>
      <input data-ri="${i}" data-rk="note" value="${esc(r.note)}" placeholder="Note (optional)"></div>${moveBtns(L, i)}</div>`).join('') || '<p class="empty">No relations yet.</p>';
  box.oninput = box.onchange = (ev) => { const el = ev.target.closest('[data-ri]'); if (el) { L[+el.dataset.ri][el.dataset.rk] = el.value; dirty(); } };
  wireList(box, L, paintRels);
  $('#reln').textContent = (L.length + M.incoming.length) ? `${L.length} out · ${M.incoming.length} in` : '';
}

async function upload(bucket, file) {
  const clean = file.name.toLowerCase().replace(/[^a-z0-9.]+/g, '-').replace(/^-+|-+$/g, '');
  const path = `${M.slug}/${Date.now().toString(36)}-${clean}`;
  const { error } = await sb.storage.from(bucket).upload(path, file, { upsert: false, contentType: file.type || undefined });
  if (error) throw new Error(/mime|type/i.test(error.message) ? `${file.name}: this kind of file is not allowed here.` : error.message);

}
function paintMedia() {
  if (!M.ref) return;
  const n = Object.keys(MEDIA).reduce((a, k) => a + M[k].length, 0);
  $('#medn').textContent = n ? `${n} ${n === 1 ? 'file' : 'files'}` : '';
  for (const k of Object.keys(MEDIA)) {
    const box = $('#m_' + k), L = M[k], cfg = MEDIA[k];
    $('#mn_' + k).textContent = cfg.max ? `${L.length} of ${cfg.max}` : (L.length ? String(L.length) : '');
    const full = cfg.max && L.length >= cfg.max;
    const drop = full ? '' : `<label class="drop">${ico('upload')}<span>Add ${cfg.label.toLowerCase()}<br><small>Select or drop files</small></span><input type="file" accept="${cfg.accept}" multiple></label>`;
    if (k === 'images') {
      box.innerHTML = `<div class="mgrid">${L.map((m, i) => `<div class="mcard"><div class="img" style="background-image:url('${esc(fileUrl('images', m.file))}')">${i === 0 ? '<span class="cover">Cover</span>' : ''}</div>
        <div class="f"><textarea data-mi="${i}" data-mk="alt" placeholder="Alt text: what the image shows">${esc(m.alt || '')}</textarea>
        <input data-mi="${i}" data-mk="caption" value="${esc(m.caption || '')}" placeholder="Caption"><input data-mi="${i}" data-mk="credit" value="${esc(m.credit || '')}" placeholder="Credit"></div>
        <div class="bar">${moveBtns(L, i)}</div></div>`).join('')}${drop}</div>`;
    } else {
      const fields = {
        audio: (m, i) => `<div class="r"><input data-mi="${i}" data-mk="label" value="${esc(m.label || '')}" placeholder="Label, for example Dry"><input data-mi="${i}" data-mk="meta" value="${esc(m.meta || '')}" placeholder="Source, place, date, duration, format"></div><input data-mi="${i}" data-mk="note" value="${esc(m.note || '')}" placeholder="Note (optional)"><audio controls preload="none" src="${esc(fileUrl('audio', m.file))}"></audio>`,
        video: (m, i) => `<input data-mi="${i}" data-mk="caption" value="${esc(m.caption || '')}" placeholder="Caption"><video controls preload="metadata" src="${esc(fileUrl('video', m.file))}"></video>`,
        files: (m, i) => `<div class="r"><input data-mi="${i}" data-mk="label" value="${esc(m.label || '')}" placeholder="Label"><input data-mi="${i}" data-mk="page_count" type="number" min="1" value="${esc(m.page_count ?? '')}" placeholder="Pages"></div><a class="fn" href="${esc(fileUrl('files', m.file))}" target="_blank" rel="noopener">${ico('file')} ${esc(m.file)}${m.size_bytes ? ` · ${(m.size_bytes / 1048576).toFixed(1)} MB` : ''}</a>`,
      }[k];
      box.innerHTML = `<div class="ol">${L.map((m, i) => `<div class="mrow"><span class="ix nr">${String(i + 1).padStart(2, '0')}</span><div class="fs">${fields(m, i)}${k !== 'files' ? `<span class="fn">${esc(m.file)}</span>` : ''}</div>${moveBtns(L, i)}</div>`).join('')}${drop}</div>`;
    }
    box.oninput = (ev) => { const el = ev.target.closest('[data-mi]'); if (el) { L[+el.dataset.mi][el.dataset.mk] = el.value; dirty(); } };
    wireList(box, L, paintMedia);
    const inp = $('input[type=file]', box), dz = $('.drop', box);
    const take = async (files) => {
      for (const f of files) {
        if (cfg.max && L.length >= cfg.max) { toast(`An entry can have at most ${cfg.max} images.`, true); break; }
        try {
          toast(`Uploading ${f.name}`);
          const file = await upload(cfg.bucket, f);
          L.push({ file, size_bytes: f.size });
          dirty(); paintMedia();
        } catch (err) { toast(err.message, true); }
      }
    };
    if (inp) inp.onchange = () => take([...inp.files]);
    if (dz) {
      dz.ondragover = (ev) => { ev.preventDefault(); dz.classList.add('over'); };
      dz.ondragleave = () => dz.classList.remove('over');
      dz.ondrop = (ev) => { ev.preventDefault(); dz.classList.remove('over'); take([...ev.dataTransfer.files]); };
    }
  }
}

async function save() {
  const b = $('#save');
  if (!M.entry.name.trim()) return toast('The entry needs a name.', true);
  if (!M.entry.summary.trim() || !M.entry.entry.trim()) return toast('The entry needs a summary and some text before it can be saved.', true);
  const badRel = M.relations.findIndex((r) => !r.to_ref);
  if (badRel >= 0) return toast(`Relation ${badRel + 1} has no entry chosen. Choose one or remove it.`, true);
  const payload = {
    ref: M.ref, type: M.type,
    entry: M.entry, facts: M.facts,
    appearances: M.appearances, relations: M.relations,
    editor_note: M.editor_note,
    private: Object.fromEntries(S.pfields.filter((x) => x.category === M.type).map((x) => [x.code, M.private[x.code] ?? ''])),
  };
  if (M.ref) {
    payload.expected_updated_at = M.updated_at;
    for (const k of Object.keys(MEDIA)) payload[k] = M[k];
  }
  b.disabled = true;
  const { data, error } = await sb.rpc('save_entry', { p: payload });
  b.disabled = false;
  if (error) return toast(error.message, true);
  M.dirty = false;
  const { data: rows } = await sb.from('entries').select('*').order('ref');
  if (rows) S.entries = rows;

}

function wireMd(id, onChange) {

// Save a row only if nobody saved it since it was opened.
async function guardedUpdate(table, keyCol, key, values) {

}

// ---------- differences between two versions ----------
function lcsOps(A, B) {
  const n = A.length, m = B.length, dp = [];
  for (let i = 0; i <= n; i++) dp.push(new Uint32Array(m + 1));
  for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--) dp[i][j] = A[i] === B[j] ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
  const ops = [];
  let i = 0, j = 0;
  while (i < n && j < m) {
    if (A[i] === B[j]) { ops.push(['=', A[i]]); i++; j++; }
    else if (dp[i + 1][j] >= dp[i][j + 1]) ops.push(['-', A[i++]]);
    else ops.push(['+', B[j++]]);
  }
  while (i < n) ops.push(['-', A[i++]]);
  while (j < m) ops.push(['+', B[j++]]);
  return ops;
}
// Word by word, within one paragraph. Long unchanged stretches are shortened.
function wordDiff(a, b) {
  const A = a.split(/(\s+)/), B = b.split(/(\s+)/);
  let p = 0;
  while (p < A.length && p < B.length && A[p] === B[p]) p++;
  let s = 0;
  while (s < A.length - p && s < B.length - p && A[A.length - 1 - s] === B[B.length - 1 - s]) s++;
  const a2 = A.slice(p, A.length - s), b2 = B.slice(p, B.length - s);
  const mid = a2.length * b2.length > 250000
    ? (a2.length ? `<del>${esc(a2.join(''))}</del>` : '') + (b2.length ? `<ins>${esc(b2.join(''))}</ins>` : '')
    : lcsOps(a2, b2).map(([o, t]) => o === '=' ? esc(t) : `<${o === '-' ? 'del' : 'ins'}>${esc(t)}</${o === '-' ? 'del' : 'ins'}>`).join('').replace(/<\/del><del>|<\/ins><ins>/g, '');
  const clip = (t, end) => { const w = t.split(/(\s+)/); return w.length > 40 ? (end ? '… ' + w.slice(-30).join('') : w.slice(0, 30).join('') + ' …') : t; };
  return esc(clip(A.slice(0, p).join(''), true)) + mid + esc(clip(A.slice(A.length - s).join(''), false));
}
// Paragraph by paragraph, then word by word inside changed paragraphs.
function diffHtml(a, b, unit = 'paragraph') {
  const P = (v) => String(v ?? '').split(/\n{2,}/);
  const ops = lcsOps(P(a), P(b)), out = [];
  let same = 0, del = [], add = [];
  const flush = () => {
    if (same) out.push(`<p class="dsame">${same} unchanged ${unit}${same === 1 ? '' : 's'}</p>`);
    same = 0;
    for (let i = 0; i < Math.max(del.length, add.length); i++) out.push(`<p>${wordDiff(del[i] ?? '', add[i] ?? '')}</p>`);
    del = []; add = [];
  };
  for (const [o, t] of ops) {
    if (o === '=') { if (del.length || add.length) flush(); same++; }
    else { if (same) { const n = same; same = 0; out.push(`<p class="dsame">${n} unchanged ${unit}${n === 1 ? '' : 's'}</p>`); } (o === '-' ? del : add).push(t); }
  }
  flush();
  return out.join('');
}
const asText = (v) => v == null ? '' : typeof v === 'boolean' ? (v ? 'Yes' : 'No') : String(v);

// ---------- history card and version dialog (in every editor) ----------
// cfg: { kind, key, compare(versionData) => [{ label, now, then }], apply(versionData) }
async function histCard(cfg) {
  const box = $('#hist');
  if (!box) return;
  const { data, error } = await sb.from('revisions').select('id,created_at,note').eq('kind', cfg.kind).eq('key', cfg.key).order('id', { ascending: false }).limit(40);
  if (error) { box.innerHTML = `<p class="empty">${esc(error.message)}</p>`; return; }
  box.innerHTML = data.length ? `<div class="list">${data.map((r, i) => `<a class="li" href="#" data-rev="${r.id}"><span class="nm">${fmtDate(r.created_at)}</span><span class="meta">${i === 0 ? 'Current' : esc(r.note || '')}</span></a>`).join('')}</div>
    <p class="help" style="font-size:12.5px;color:var(--muted);margin:8px 0 0">Every save is kept. Select one to compare it with the editor and load it back.</p>` : '<p class="empty">No saved versions yet.</p>';
  box.onclick = async (ev) => {
    const a = ev.target.closest('[data-rev]');
    if (!a) return;
    ev.preventDefault();
    const { data: rev, error: e2 } = await sb.from('revisions').select('*').eq('id', a.dataset.rev).single();
    if (e2) return toast(e2.message, true);
    const diffs = cfg.compare(rev.data).filter((d) => asText(d.now) !== asText(d.then));
    const d = $('#dlg');
    d.innerHTML = `<form class="dlg wide" method="dialog">
      <h2>Version of ${fmtDate(rev.created_at)}</h2>
      <p>${diffs.length ? `Compared with what is in the editor now. <del>Struck-through text</del> would go; <ins>highlighted text</ins> would come back.` : 'This version is the same as what is in the editor now.'}</p>
      ${diffs.length ? `<div class="diffs">${diffs.map((x) => `<div class="dif"><b>${esc(x.label)}</b><div class="dtx">${diffHtml(asText(x.now), asText(x.then), x.unit)}</div></div>`).join('')}</div>` : ''}
      <div class="acts"><button class="btn ghost" value="cancel">Close</button>${diffs.length ? `<button class="btn pri" type="button" id="hload">${ico('clock')}Load this version</button>` : ''}</div></form>`;
    d.showModal();
    if ($('#hload')) $('#hload').onclick = () => {
      cfg.apply(rev.data);
      d.close();
      dirty();
      toast('Loaded into the editor. Save to restore it, or Discard to keep what you had.');
    };
  };
}

// Entries
function entryCompare(v) {
  const e = M.entry, t = M.type, out = [];
  const F = { name: 'Name', aliases: 'Aliases', mark: 'Mark', grade: 'Grade', source_count: 'Source count', summary: 'Summary', entry: 'Entry', appears_in: 'Appears in (text)', reliability: 'Reliability', cross_references_note: 'Cross-references note', archivist_note: 'Archivist note', status: 'Status', published: 'Show on the site', featured_order: 'Featured order', icon: 'Icon', lottie: 'Lottie animation' };
  for (const [k, l] of Object.entries(F)) out.push({ label: l, now: e[k] ?? '', then: v.entry[k] ?? '' });
  const fact = (k, x) => k === 'tuning' && x ? (S.tunings.find((o) => o.code === x) || { label: x }).label : x ?? '';
  for (const [k, l] of FACTS[t].map((f) => [f[0], f[1]])) out.push({ label: 'Key fact: ' + l, now: fact(k, M.facts[k]), then: fact(k, (v.facts || {})[k]) });
  const sec = (s) => (S.sections.find((x) => x.slug === s) || { label: s }).label || s;
  const ent = (r) => (S.entries.find((x) => x.ref === r) || { name: r }).name;
  const rt = (c) => (S.rtypes.find((x) => x.code === c) || { label: c }).label;
  out.push({ unit: 'line', label: 'Story sections', now: M.appearances.map(sec).join('\n\n'), then: (v.appearances || []).map(sec).join('\n\n') });
  out.push({ unit: 'line', label: 'Relations', now: M.relations.map((r) => `${rt(r.type)}: ${ent(r.to_ref)}${r.note ? ` (${r.note})` : ''}`).join('\n\n'), then: (v.relations || []).map((r) => `${rt(r.type)}: ${ent(r.to_ref)}${r.note ? ` (${r.note})` : ''}`).join('\n\n') });
  for (const k of Object.keys(MEDIA)) {
    const line = (m) => [m.file, m.alt, m.caption, m.credit, m.label, m.meta, m.note, m.page_count && `${m.page_count} pages`].filter(Boolean).join(' · ');
    out.push({ unit: 'line', label: MEDIA[k].label, now: (M[k] || []).map(line).join('\n\n'), then: (v[k] || []).map(line).join('\n\n') });
  }
  out.push({ label: 'Editor note (private)', now: M.editor_note || '', then: v.editor_note || '' });
  // Versions saved before private fields existed have none to compare.
  if (v.private) for (const x of S.pfields.filter((f) => f.category === t)) out.push({ label: x.label, now: M.private[x.code] || '', then: v.private[x.code] || '' });
  return out;
}
function entryApply(v) {
  const keep = { ref: M.entry.ref, type: M.entry.type, slug: M.entry.slug, updated_at: M.entry.updated_at, created_at: M.entry.created_at };
  M.entry = { ...M.entry, ...v.entry, ...keep };
  // Every key fact is set, so what the editor shows is what Save stores.
  M.facts = Object.fromEntries(FACTS[M.type].map(([k]) => [k, (v.facts || {})[k] ?? null]));
  M.appearances = [...(v.appearances || [])];
  M.relations = (v.relations || []).map((r) => ({ type: r.type, to_ref: r.to_ref, note: r.note || '' }));
  for (const k of Object.keys(MEDIA)) M[k] = (v[k] || []).map((x) => ({ ...x }));
  M.editor_note = v.editor_note || '';
  // Versions saved before private fields existed keep the current values.
  if (v.private) M.private = { ...v.private };
  renderEditor();
  histCard({ kind: 'entry', key: M.ref, compare: entryCompare, apply: entryApply });
}

}

const BUCKETS = [['images', 'Images', 'image/jpeg,image/png,image/webp,image/gif,image/svg+xml,image/avif'], ['audio', 'Audio', 'audio/*'], ['video', 'Video', 'video/mp4,video/webm,video/quicktime'], ['files', 'Files', 'application/pdf,.doc,.docx,.odt,.rtf,.txt,.epub'], ['lottie', 'Animations', 'application/json,application/zip,.json,.lottie']];
const fmtSize = (b) => b == null ? '' : b < 1024 ? b + ' B' : b < 1048576 ? (b / 1024).toFixed(0) + ' KB' : (b / 1048576).toFixed(1) + ' MB';
async function loadMedia() {
  const [files, im, au, vi, fi, home] = await Promise.all([
    sb.rpc('media_files'),
    sb.from('entry_images').select('file,entry_ref'), sb.from('entry_audio').select('file,entry_ref'),
    sb.from('entry_video').select('file,entry_ref'), sb.from('entry_files').select('file,entry_ref'),
    sb.from('site_content').select('data').eq('key', 'home').maybeSingle(),
  ]);
  const bad = [files, im, au, vi, fi, home].find((x) => x.error);
  if (bad) throw bad.error;
  const uses = {};
  const add = (bucket, file, label, href) => { const k = bucket + '/' + file; (uses[k] = uses[k] || []).push({ label, href }); };
  const ent = (r) => S.entries.find((x) => x.ref === r) || { name: r, slug: '' };
  [['images', im], ['audio', au], ['video', vi], ['files', fi]].forEach(([b, r]) => r.data.forEach((x) => { const e = ent(x.entry_ref); add(b, x.file, e.name, '#/e/' + e.slug); }));
  S.entries.filter((e) => e.lottie).forEach((e) => add('lottie', e.lottie, e.name, '#/e/' + e.slug));
  const homeText = JSON.stringify(home.data ? home.data.data : '');
  for (const f of files.data) if (homeText.includes('/' + f.bucket + '/' + f.name)) add(f.bucket, f.name, 'Home page copy', '#/home');
  S.media = files.data.map((f) => ({ ...f, uses: uses[f.bucket + '/' + f.name] || [] }));
  return S.media;
}
