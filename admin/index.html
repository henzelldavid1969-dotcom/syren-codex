          <div class="f"><span class="fn mono" title="${esc(f.name)}" style="font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(f.name)}</span><span class="nr">${fmtSize(f.size)} · ${fmtDay(f.created_at)}</span><div>${usedBy(f)}</div></div>
          <div class="bar">${acts(f, i)}</div></div>`).join('')}</div>`
      : `<div class="ol">${xs.map((f, i) => `<div class="mrow" style="grid-template-columns:24px minmax(0,1fr) auto"><span class="nr">${ico('file')}</span><div class="fs"><a class="fn" href="${esc(fileUrl(f.bucket, f.name))}" target="_blank" rel="noopener" style="color:var(--fg)">${esc(f.name)}</a><span class="nr">${fmtSize(f.size)} · ${fmtDay(f.created_at)}</span><div>${usedBy(f)}</div></div><div style="display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end">${acts(f, i)}</div></div>`).join('')}</div>`;
    $('#mlist').onclick = async (ev) => {
      const c = ev.target.closest('[data-copy]'), dl = ev.target.closest('[data-del]');
      if (c) { const f = xs[+c.dataset.copy]; try { await navigator.clipboard.writeText(fileUrl(f.bucket, f.name)); toast('Address copied.'); } catch { prompt('The address:', fileUrl(f.bucket, f.name)); } }
      if (dl && !dl.disabled) {
        const f = xs[+dl.dataset.del];
        if (!confirm(`Delete ${f.name}? This cannot be undone.`)) return;
        const { error } = await sb.storage.from(f.bucket).remove([f.name]);
        if (error) return toast(error.message, true);
        S.media = S.media.filter((x) => x !== f);
        toast('Deleted.');
        paint();
      }
    };
    history.replaceState(null, '', '#/media?b=' + st.b);
    lastHash = location.hash;
  };
  $('#mbk').onclick = (ev) => { const b = ev.target.closest('button'); if (b) { st.b = b.dataset.b; paint(); } };
  $('#munused').onchange = (ev) => { st.unused = ev.target.checked; paint(); };
  $('#mq').oninput = (ev) => { st.q = ev.target.value; paint(); };
  $('#mup').onchange = async (ev) => {
    for (const f of ev.target.files) {
      const clean = f.name.toLowerCase().replace(/[^a-z0-9.]+/g, '-').replace(/^-+|-+$/g, '');
      toast(`Uploading ${f.name}`);
      const { error } = await sb.storage.from(st.b).upload(`library/${Date.now().toString(36)}-${clean}`, f, { upsert: false, contentType: f.type || undefined });
      if (error) toast(/mime|type/i.test(error.message) ? `${f.name}: this kind of file does not belong in ${st.b}.` : error.message, true);
    }
    ev.target.value = '';
    await loadMedia();
    paint();
  };
  paint();
}

// Pick a file from the library for an entry's media list.
async function pickFromLibrary(kind) {
  const cfg = MEDIA[kind];
  try { await loadMedia(); } catch (err) { return toast(err.message, true); }
  const have = new Set(M[kind].map((m) => m.file));
  const xs = S.media.filter((f) => f.bucket === cfg.bucket && !have.has(f.name));
  const d = $('#dlg');
  d.innerHTML = `<form class="dlg wide" method="dialog"><h2>Choose from the library</h2>
    <p>${xs.length ? `${cfg.label} not yet on this entry. Select one to add it.` : `Every file in ${cfg.label.toLowerCase()} is already on this entry, or there are none yet.`}</p>
    <div class="pick">${xs.map((f, i) => kind === 'images'
      ? `<button type="button" class="pk img" data-i="${i}" title="${esc(f.name)}" style="background-image:url('${esc(fileUrl(f.bucket, f.name))}')"><span>${esc(f.name.split('/').pop())}</span></button>`
      : `<button type="button" class="pk" data-i="${i}">${ico('file')} <span>${esc(f.name)}</span> <small class="nr">${fmtSize(f.size)}</small></button>`).join('')}</div>
    <div class="acts"><button class="btn ghost" value="cancel">Close</button></div></form>`;
  d.showModal();
  $('.pick', d).onclick = (ev) => {
    const b = ev.target.closest('[data-i]');
    if (!b) return;
    if (cfg.max && M[kind].length >= cfg.max) { toast(`An entry can have at most ${cfg.max} images.`, true); return; }
    const f = xs[+b.dataset.i];
    M[kind].push({ file: f.name, size_bytes: f.size });
    d.close();
    dirty();
    paintMedia();
  };
}

// ---------- publish ----------
function openPublish() {
  const d = $('#dlg'), ch = changed(), rel = lastRelease();
  if (M && M.dirty) return toast('Save or discard the changes on this page first.', true);
  d.innerHTML = `<form class="dlg" method="dialog">
    <h2>Publish to the live site</h2>
    <p>${!rel ? 'This is the first publish from the admin. It sends the whole archive as it is now.' : ch.length ? `${ch.length === 1 ? 'This has' : `These ${ch.length} have`} changed since the last publish:` : 'Nothing has changed since the last publish. You can still publish again to rebuild the site.'}</p>
    ${rel && ch.length ? `<div class="chg list">${ch.slice(0, 200).map((x) => `<div class="li"><span class="ref">${esc(x.ref)}</span><span class="nm">${esc(x.name)}</span><span class="meta">${ago(x.at)}</span></div>`).join('')}</div>` : ''}
    <div class="fld"><label for="pnote">Note for the history <span class="help">Optional</span></label><input id="pnote" type="text" placeholder="For example: Grades for the Locations"></div>
    <div class="steps" id="steps" hidden></div>
    <div class="acts"><button class="btn ghost" value="cancel" id="pcancel">Cancel</button><button class="btn pri" type="button" id="pgo">${ico('upload')}Publish now</button></div></form>`;
  d.showModal();
  $('#pgo').onclick = async () => {
    const steps = $('#steps');
    const go = $('#pgo');
    go.disabled = true;
    steps.hidden = false;
    const paint = (n, msg) => { steps.innerHTML = ['Save a release of the site data', 'Rebuild the live site', 'Live'].map((l, i) => `<div class="${i < n ? 'done' : i === n ? 'on' : ''}"><span class="dot"></span>${i === 1 && msg ? esc(msg) : l}</div>`).join(''); };
    paint(0);
    try {
      const { data: { session } } = await sb.auth.getSession();
      const r = await fetch('/api/publish', { method: 'POST', headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + session.access_token }, body: JSON.stringify({ note: $('#pnote').value }) });
      const j = await r.json().catch(() => ({ error: 'The publish service did not answer.' }));
      if (!r.ok) throw new Error(j.error || 'Publishing failed.');
      paint(1, j.rebuild === 'started' ? 'Rebuilding the live site. This usually takes about a minute.' : 'Waiting for the scheduled rebuild. This can take up to 20 minutes.');
      $('#pcancel').textContent = 'Close';
      await loadBase();
      paintPublish();
      if (location.hash === '#/' || location.hash === '') viewDash();
      const t0 = Date.now();
      const poll = async () => {
        const live = await fetch('/release.json?' + Date.now(), { cache: 'no-store' }).then((x) => x.json()).catch(() => null);
        if (live && live.id >= j.release) { S.live = live; paint(3); toast('The live site is up to date.'); if (location.hash === '#/' || location.hash === '') viewDash(); return; }
        if (Date.now() - t0 < 25 * 60000 && d.open) setTimeout(poll, 6000);
      };
      setTimeout(poll, 8000);
    } catch (err) {
      steps.innerHTML = `<div class="note bad">${esc(err.message)}</div>`;
      go.disabled = false;
    }
  };
}

// ---------- Tuning options ----------
// The choices for a character's Tuning. A character keeps its choice when
// an option is renamed. An option in use cannot be removed.
async function viewTunings() {
  setNav('#/tunings');
  crumbs([['Tuning options']]);
  $('#view').innerHTML = '<div class="view loading">Loading the options</div>';
  const { data: rows, error } = await sb.from('character_facts').select('tuning').not('tuning', 'is', null);
  if (error) return toast(error.message, true);
  const used = {};
  for (const r of rows) used[r.tuning] = (used[r.tuning] || 0) + 1;
  M = { dirty: false, list: S.tunings.map((x) => ({ code: x.code, label: x.label })) };
  $('#view').innerHTML = `<div class="view">
    <h1 class="pt">Tuning options</h1><p class="lede">The choices for a character's Tuning, in the order the entry editor lists them. A renamed option is renamed on every character that has it. The site shows the change after you publish.</p>
    <div class="card"><div class="ol" id="tlist"></div>
      <div class="addrow"><button class="btn sm" type="button" id="tadd">${ico('plus')}Add an option</button></div></div></div>
    ${saveBar()}`;
  const paint = () => {
    const box = $('#tlist'), L = M.list;
    box.innerHTML = L.map((x, i) => {
      const n = x.code ? used[x.code] || 0 : 0;
      return `<div class="oi"><span class="ix">${String(i + 1).padStart(2, '0')}</span><div class="row">
        <input data-ti="${i}" value="${esc(x.label)}" placeholder="Option name" aria-label="Option ${i + 1}">
        <span class="nr" style="white-space:nowrap;font-size:13px">${n ? `${n} ${n === 1 ? 'character' : 'characters'}` : x.code ? 'Not used' : 'New'}</span></div>${moveBtns(L, i)}</div>`;
    }).join('') || '<p class="empty">No options yet.</p>';
    L.forEach((x, i) => {
      if (x.code && used[x.code]) { const b = $(`[data-rm="${i}"]`, box); b.disabled = true; b.title = 'In use: choose another option on those characters first'; }
    });
    box.oninput = (ev) => { const el = ev.target.closest('[data-ti]'); if (el) { L[+el.dataset.ti].label = el.value; dirty(); } };
    wireList(box, L, paint);
  };
  $('#tadd').onclick = () => { M.list.push({ code: null, label: '' }); paint(); dirty(); $(`[data-ti="${M.list.length - 1}"]`).focus(); };
  wireSaveBar(async () => {
    const names = M.list.map((x) => x.label.trim().toLowerCase());
    if (names.some((x) => !x)) return toast('Every option needs a name.', true);
    if (new Set(names).size !== names.length) return toast('Two options have the same name.', true);
    $('#save').disabled = true;
    const { error: err } = await sb.rpc('save_tunings', { p: M.list.map((x) => ({ code: x.code, label: x.label.trim() })) });
    $('#save').disabled = false;
    if (err) return toast(err.message, true);
    const { data } = await sb.from('tunings').select('*').order('position');
    if (data) S.tunings = data;
    M.dirty = false;
    paintPublish();
    toast('Saved. Publish when you are ready for the site to show it.');
    viewTunings();
  });
  paint();
}

// ---------- start ----------
sb.auth.onAuthStateChange((ev) => { if (ev === 'SIGNED_OUT') { M = null; location.replace('/admin/'); } });
(async function boot() {
  const hp = new URLSearchParams(location.hash.slice(1));
  const linkErr = hp.get('error_description');
  const { data: { session } } = await sb.auth.getSession();
  if (/access_token|error=/.test(location.hash)) history.replaceState(null, '', location.pathname + '#/');
  if (!session) return showSignIn(linkErr ? 'That sign-in link has expired or was already used. Send a new one.' : '');
  S.user = session.user;
  const { data: own, error } = await sb.rpc('is_owner');
  if (error || own !== true) return showNoAccess(session.user.email);
  try { await loadBase(); } catch (err) { $('#root').innerHTML = `<div class="auth"><div class="authcard"><h1>Could not load</h1><p>${esc(err.message)}</p></div></div>`; return; }
  shell();
  window.addEventListener('hashchange', route);
  route();
})();
</script>
