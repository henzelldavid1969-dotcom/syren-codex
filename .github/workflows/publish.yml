# Edits in the admin go live only when David presses Publish there. Publish
# saves a release in the database and rebuilds the site straight away (when
# the Vercel deploy hook is set up). This check runs every 15 minutes as a
# fallback: if there is a release the repository does not have yet, it saves
# it to data/, and Vercel rebuilds the site from that commit. It never
# exports unpublished edits. Each check also counts as activity, so the free
# Supabase project does not pause.
name: Publish from Supabase

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Look for a new release
        run: node scripts/sync-release.mjs
      - name: Save any changes
        run: |
          if git diff --quiet -- data/ && [ -z "$(git status --porcelain data/)" ]; then
            # GitHub stops scheduled checks in a repository with no activity
            # for 60 days, so record a check once a month even when quiet.
            last=$(git log -1 --format=%ct)
            if [ $(( $(date +%s) - last )) -lt 2592000 ]; then
              echo "No changes."
              exit 0
            fi
            date -u +%F > data/last-checked.txt
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git commit -m "Save the published release from the admin"
          git push
