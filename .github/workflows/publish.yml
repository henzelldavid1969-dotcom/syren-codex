# Checks the Supabase database every 15 minutes. If anything has changed,
# it saves a fresh data/codex.json, and Vercel rebuilds the site from it.
# Each check also counts as activity, so the free Supabase project does not
# pause. To publish straight away: Actions tab, "Publish from Supabase",
# "Run workflow".
name: Publish from Supabase

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Export from Supabase
        run: node scripts/export.mjs
        env:
          # Public, read-only values. Safe to keep here.
          SUPABASE_URL: https://qldxlphmvjjovzlmeguw.supabase.co
          SUPABASE_PUBLISHABLE_KEY: sb_publishable_U4rHZlnmKnyPzdufaovQ9w_odaCFZbP
      - name: Save any changes
        run: |
          if git diff --quiet -- data/codex.json; then
            # GitHub stops scheduled checks in a repository with no activity
            # for 60 days, so record a check once a month even when quiet.
            last=$(git log -1 --format=%ct)
            if [ $(( $(date +%s) - last )) -lt 2592000 ]; then
              echo "No changes."
              exit 0
            fi
            date -u +%F > data/last-checked.txt
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git commit -m "Update Codex data from Supabase"
          git push
